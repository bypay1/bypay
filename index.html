<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Bypay Bank"/>
<meta name="theme-color" content="#0A2463"/>
<title>Bypay Bank</title>
<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0A2463;color:#0D1B3E;overflow:hidden;}
#root{height:100%;}
::-webkit-scrollbar{width:0;}
input,select,textarea,button{font-family:inherit;-webkit-appearance:none;}
@keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
<script>
window.onerror=function(msg,src,line){
  var el=document.getElementById("pre-loader");
  if(el){el.innerHTML='<div style="padding:32px 24px;color:#fff;text-align:center;max-width:360px;margin:0 auto;">'
    +'<div style="font-size:48px;margin-bottom:20px;">⚠️</div>'
    +'<div style="font-size:18px;font-weight:700;margin-bottom:10px;">App Failed to Start</div>'
    +'<div style="font-size:13px;color:rgba(255,255,255,0.6);line-height:1.8;margin-bottom:20px;">'+msg+'</div>'
    +'<div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:16px;font-size:12px;color:rgba(255,255,255,0.5);line-height:2;">'
    +'• Open in Google Chrome<br/>• Clear browser cache (Ctrl+Shift+Delete)<br/>'
    +'• Upload to GitHub Pages for full features</div></div>';}
};
window.addEventListener("unhandledrejection",function(e){console.error("Unhandled:",e.reason);});
</script>

  if (!dob) return 0;

  let a = n.getFullYear() - d.getFullYear();
  if (n.getMonth() < d.getMonth() || n.getMonth() === d.getMonth() && n.getDate() < d.getDate()) a--;
  return a;
};

  async login(email, pass, admin = false) {

      }
      const u = DEMO.users.find(x => x.email === email && x.password_hash === hashP(pass) && x.status === "active");
      if (!u) throw new Error("Incorrect email or password");
      const acct = DEMO.accounts.find(a => a.user_id === u.id);
      return {
        type: "client",
        user: {
          ...u
        },
        account: {

        }
      };
    }
    const c = await fbAuth.signInWithEmailAndPassword(email, pass);

      return {
        type: "admin",
        admin: {
          id: uid2,
          ...s.data()
        }
      };
    }
    try {
      const [us, as] = await Promise.all([fbDB.collection("users").doc(uid2).get(), fbDB.collection("accounts").where("user_id", "==", uid2).limit(1).get()]);
      const a = as.docs[0];
      return {
        type: "client",
        user: {
          id: uid2,
          ...us.data()
        },
        account: {
          id: a?.id,
