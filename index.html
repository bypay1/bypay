              </div>
              {users.map(u=>{
                const a=acctMap[u.id];
                return(
                  <Card key={u.id} style={{marginBottom:10,padding:14}} onClick={()=>sScreen(<AdminClientDetail user={u} account={a} sAccounts={sAccounts}/>)} press>
                    <div style={{display:"flex",gap:12,alignItems:"center"}}>
                      <div style={{width:46,height:46,borderRadius:14,background:C.blueP,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:800,color:C.blue,flexShrink:0}}>{(u.first_name?.[0]||"?")+""+(u.last_name?.[0]||"")}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.full_name||`${u.first_name} ${u.last_name}`}</div>
                        <div style={{fontSize:11,color:C.muted}}>{u.account_number} · {u.account_type}</div>
                        <div style={{display:"flex",gap:6,marginTop:5,flexWrap:"wrap"}}>
                          <span style={{background:u.kyc_status==="verified"?C.greenP:C.goldP,color:u.kyc_status==="verified"?C.green:C.orange,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:8}}>{u.kyc_status==="verified"?"✓ KYC Verified":"⚠ KYC Pending"}</span>
                          {u.status!=="active"&&<span style={{background:C.redP,color:C.red,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:8}}>{u.status}</span>}
                        </div>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontWeight:700,fontSize:13,color:C.green}}>{fmtS(a?.balance||0)}</div>
                        <div style={{fontSize:11,color:C.muted,marginTop:2}}>›</div>
                      </div>
                    </div>
                  </Card>
                );
              })}
            </div>
          )}

          {/* TRANSACTIONS */}
          {activeTab==="txns"&&(
            <div style={{padding:16}}>
              <Card>
                {txns.map(t=>(
                  <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{width:40,height:40,borderRadius:12,background:CAT[t.category]?.bg||"#F8F9FA",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0,fontWeight:700,color:CAT[t.category]?.color||C.muted}}>{CAT[t.category]?.icon||"💳"}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.description}</div>
                      <div style={{fontSize:11,color:C.muted}}>{userMap[t.user_id]?.full_name} · {t.created_at?.slice(0,10)}</div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      <div style={{fontWeight:700,fontSize:13,color:t.type==="credit"?C.green:C.red}}>{t.type==="credit"?"+":"-"}{fmt(t.amount)}</div>
                      <div style={{fontSize:10,color:C.muted}}>{t.status}</div>
                    </div>
                  </div>
                ))}
              </Card>
            </div>
          )}

          {/* NOTIFICATIONS */}
          {activeTab==="notifs"&&(
            <div style={{padding:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div style={{fontWeight:700,fontSize:15}}>All Notifications</div>
                <button onClick={async()=>{await Promise.all(notifs.filter(n=>!n.read_status).map(n=>DS.markNotifRead(n.id)));sNotifs(prev=>prev.map(n=>({...n,read_status:1})));t$("All marked read");}} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Mark All Read</button>
              </div>
              <Card>
                {notifs.map(n=>(
                  <div key={n.id} style={{display:"flex",gap:12,padding:"12px 0",borderBottom:`1px solid ${C.border}`,opacity:n.read_status?0.55:1,cursor:"pointer"}}
                    onClick={async()=>{await DS.markNotifRead(n.id);sNotifs(prev=>prev.map(x=>x.id===n.id?{...x,read_status:1}:x));}}>
                    <div style={{width:36,height:36,borderRadius:10,background:{success:C.greenP,warning:C.goldP,alert:C.redP,info:C.blueP}[n.type]||C.blueP,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{{success:"✅",warning:"⚠️",alert:"🚨",info:"ℹ️"}[n.type]||"ℹ️"}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:n.read_status?500:700,fontSize:12,marginBottom:2}}>{userMap[n.user_id]?.full_name||"System"}</div>
                      <div style={{fontSize:12,color:C.muted,lineHeight:1.4,overflow:"hidden",textOverflow:"ellipsis",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{n.message}</div>
                      <div style={{fontSize:10,color:C.border,marginTop:3}}>{n.created_at?.slice(0,16)}</div>
                    </div>
                  </div>
                ))}
              </Card>
            </div>
          )}

          {/* SECURITY & SETTINGS */}
          {activeTab==="security"&&<AdminSecurityPanel users={users} accounts={accounts} txns={txns} loans={loans} notifs={notifs} t$={t$} admin={admin}/>}

        </div>

        <div style={{background:C.tabBg,borderTop:`1px solid ${C.border}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom)",flexShrink:0,boxShadow:"0 -4px 20px rgba(10,36,99,0.07)"}}>
          {ADMIN_TABS.map(t=>(
            <button key={t.id} onClick={()=>sTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 4px 8px",background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",position:"relative"}}>
              <div style={{fontSize:20,color:activeTab===t.id?C.navy:C.muted,transform:activeTab===t.id?"scale(1.1)":"scale(1)",transition:"all .2s"}}>{t.icon}</div>
              <div style={{fontSize:10,fontWeight:activeTab===t.id?700:500,color:activeTab===t.id?C.navy:C.muted}}>{t.label}</div>
              {t.badge>0&&<div style={{position:"absolute",top:8,right:"50%",marginRight:-20,minWidth:16,height:16,background:C.red,borderRadius:8,fontSize:9,fontWeight:800,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{t.badge}</div>}
              {activeTab===t.id&&<div style={{position:"absolute",bottom:0,width:20,height:3,background:C.navy,borderRadius:"3px 3px 0 0"}}/>}
            </button>
          ))}
        </div>
      </>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   CLIENT SECURITY SCREEN
══════════════════════════════════════════════════════ */
function SecurityScreen({user,sUser,t$,onBack}){
  const[tab,sTab]=useState("overview");
  const[curPass,sCurPass]=useState("");
  const[newPass,sNewPass]=useState("");
  const[confPass,sConfPass]=useState("");
  const[curPin,sCurPin]=useState("");
  const[newPin,sNewPin]=useState("");
  const[confPin,sConfPin]=useState("");
  const[saving,sSaving]=useState(false);
  const[twoFA,sTwoFA]=useState(user.two_fa_enabled||false);
  const[loginAlerts,sLoginAlerts]=useState(user.login_alerts!==false);
  const[txnAlerts,sTxnAlerts]=useState(user.txn_alerts!==false);
  const[biometric,sBiometric]=useState(user.biometric||false);
  const[autoLock,sAutoLock]=useState(user.auto_lock||"5");
  const TABS=[{id:"overview",l:"🛡 Overview"},{id:"password",l:"🔒 Password"},{id:"pin",l:"🔢 PIN"},{id:"prefs",l:"⚙️ Prefs"}];

  async function changePassword(){
    if(!curPass)return t$("Enter current password","error");
    if(newPass.length<6)return t$("New password must be at least 6 characters","error");
    if(newPass!==confPass)return t$("New passwords do not match","error");
    if(curPass===newPass)return t$("New password must be different","error");
    sSaving(true);
    try{
      if(!IS_DEMO){
        const user_fb=fbAuth.currentUser;
        const cred=firebase.auth.EmailAuthProvider.credential(user.email,curPass);
        await user_fb.reauthenticateWithCredential(cred);
        await user_fb.updatePassword(newPass);
      } else {
        /* Demo mode — simulate password change */
        if(curPass!=="1234"&&!DEMO.users.find(u=>u.id===user.id&&u.password_hash===`h_${curPass}_bpy`))
          throw new Error("Current password is incorrect");
        const u=DEMO.users.find(u=>u.id===user.id);
        if(u) u.password_hash=`h_${newPass}_bpy`;
      }
      await DS.addNotif(user.id,"Your account password was changed successfully. If you did not do this, contact us immediately.","warning");
      sCurPass("");sNewPass("");sConfPass("");
      t$("Password changed successfully!");
    }catch(e){
      const msg=e.code==="auth/wrong-password"?"Current password is incorrect":e.message;
      t$(msg,"error");
    }
    sSaving(false);
  }

  async function changePin(){
    if(curPin!=="1234")return t$("Current PIN is incorrect. Demo PIN: 1234","error");
    if(newPin.length!==4)return t$("PIN must be exactly 4 digits","error");
    if(newPin!==confPin)return t$("New PINs do not match","error");
    if(curPin===newPin)return t$("New PIN must be different","error");
    sSaving(true);
    await DS.updateUser(user.id,{pin_hash:`h_${newPin}_bpy`});
    await DS.addNotif(user.id,"Your transaction PIN was changed successfully.","info");
    sCurPin("");sNewPin("");sConfPin("");
    t$("Transaction PIN changed!");
    sSaving(false);
  }

  async function savePrefs(){
    sSaving(true);
    await DS.updateUser(user.id,{two_fa_enabled:twoFA,login_alerts:loginAlerts,txn_alerts:txnAlerts,biometric,auto_lock:autoLock});
    sUser(prev=>({...prev,two_fa_enabled:twoFA,login_alerts:loginAlerts,txn_alerts:txnAlerts,biometric,auto_lock:autoLock}));
    t$("Security preferences saved!");
    sSaving(false);
  }

  /* Fake activity log for demo */
  const ACTIVITY=[
    {action:"Login",device:"iPhone 14 · Safari",location:"Denver, CO",time:"Today, 9:14 AM",status:"success"},
    {action:"Transfer Sent",device:"iPhone 14 · Safari",location:"Denver, CO",time:"Today, 9:22 AM",status:"success"},
    {action:"Login",device:"Chrome · Windows",location:"Denver, CO",time:"Yesterday, 3:45 PM",status:"success"},
    {action:"Password Change",device:"iPhone 14 · Safari",location:"Denver, CO",time:"3 days ago",status:"success"},
    {action:"Failed Login",device:"Unknown Device",location:"Lagos, Nigeria",time:"5 days ago",status:"failed"},
  ];

  return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title="Security Center" left={<IBtn icon="←" onClick={onBack}/>}/>
        <div style={{display:"flex",gap:3,padding:"8px 12px 12px",overflowX:"auto"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>sTab(t.id)} style={{whiteSpace:"nowrap",padding:"8px 14px",borderRadius:10,border:"none",background:tab===t.id?"rgba(255,255,255,0.18)":"transparent",color:tab===t.id?"#fff":"rgba(255,255,255,0.5)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:16}}>

        {/* ── OVERVIEW ── */}
        {tab==="overview"&&(
          <>
            {/* Security score */}
            <Card style={{marginBottom:16,background:`linear-gradient(135deg,${C.navy},${C.navyM})`,padding:22}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:4}}>Security Score</div>
                  <div style={{fontFamily:"serif",fontSize:38,fontWeight:700,color:twoFA&&loginAlerts?"#4ade80":loginAlerts?"#facc15":"#f87171"}}>{twoFA&&loginAlerts?"92":loginAlerts?"74":"48"}<span style={{fontSize:16,color:"rgba(255,255,255,0.4)"}}>/100</span></div>
                </div>
                <div style={{width:64,height:64,borderRadius:32,border:"4px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.08)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>{twoFA&&loginAlerts?"🛡":"⚠️"}</div>
              </div>
              <div style={{height:6,background:"rgba(255,255,255,0.1)",borderRadius:4}}>
                <div style={{height:"100%",borderRadius:4,background:twoFA&&loginAlerts?"#4ade80":loginAlerts?"#facc15":"#f87171",width:twoFA&&loginAlerts?"92%":loginAlerts?"74%":"48%",transition:"width .6s"}}/>
              </div>
            </Card>

            {/* Security checklist */}
            <Card style={{marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>Security Checklist</div>
              {[
                {label:"Strong Password Set",done:true,action:"Change",tab:"password"},
                {label:"Transaction PIN Set",done:true,action:"Change",tab:"pin"},
                {label:"Login Alerts Enabled",done:loginAlerts,action:loginAlerts?"✓":"Enable",tab:"prefs"},
                {label:"Transaction Alerts",done:txnAlerts,action:txnAlerts?"✓":"Enable",tab:"prefs"},
                {label:"Two-Factor Auth (2FA)",done:twoFA,action:twoFA?"On":"Enable",tab:"prefs"},
                {label:"Biometric Login",done:biometric,action:biometric?"On":"Setup",tab:"prefs"},
                {label:"KYC Verified",done:user.kyc_status==="verified",action:user.kyc_status==="verified"?"✓":"Verify"},
              ].map((item,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:`1px solid ${C.border}`}}>
                  <div style={{width:26,height:26,borderRadius:13,background:item.done?C.greenP:C.redP,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0,color:item.done?C.green:C.red,fontWeight:700}}>{item.done?"✓":"!"}</div>
                  <div style={{flex:1,fontSize:13,fontWeight:600}}>{item.label}</div>
                  {item.tab&&<button onClick={()=>sTab(item.tab)} style={{background:item.done?C.bg:C.blue,border:"none",borderRadius:8,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer",color:item.done?C.muted:"#fff",fontFamily:"inherit"}}>{item.action}</button>}
                </div>
              ))}
            </Card>

            {/* Login activity */}
            <Card>
              <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>Recent Login Activity</div>
              {ACTIVITY.map((a,i)=>(
                <div key={i} style={{display:"flex",gap:12,padding:"11px 0",borderBottom:`1px solid ${C.border}`,alignItems:"flex-start"}}>
                  <div style={{width:36,height:36,borderRadius:10,background:a.status==="success"?C.greenP:C.redP,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{a.status==="success"?"✅":"🚨"}</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:13}}>{a.action}</div>
                    <div style={{fontSize:11,color:C.muted,marginTop:2}}>{a.device}</div>
                    <div style={{fontSize:11,color:C.muted}}>📍 {a.location} · {a.time}</div>
                  </div>
                  {a.status==="failed"&&<span style={{background:C.redP,color:C.red,fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:8,flexShrink:0}}>BLOCKED</span>}
                </div>
              ))}
            </Card>
          </>
        )}

        {/* ── PASSWORD ── */}
        {tab==="password"&&(
          <>
            <Card style={{marginBottom:16,background:C.blueP,padding:16}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>🔒 Change Your Password</div>
              <div style={{fontSize:12,color:C.muted,lineHeight:1.7}}>Use a strong password with at least 8 characters, numbers, and symbols. Never share your password with anyone — including bank staff.</div>
            </Card>
            <Card>
              <Input label="Current Password" type="password" value={curPass} onChange={sCurPass} placeholder="Enter current password" icon="🔒"/>
              <Input label="New Password" type="password" value={newPass} onChange={sNewPass} placeholder="Min. 6 characters" icon="🔑" note="Use uppercase, numbers and symbols for a stronger password"/>
              <Input label="Confirm New Password" type="password" value={confPass} onChange={sConfPass} placeholder="Re-enter new password" icon="🔑"/>
              {newPass&&(
                <div style={{marginBottom:14}}>
                  <div style={{fontSize:11,color:C.muted,marginBottom:6}}>Password Strength</div>
                  <div style={{height:5,background:C.border,borderRadius:4}}>
                    <div style={{height:"100%",borderRadius:4,transition:"width .3s",
                      width:newPass.length>=10&&/[A-Z]/.test(newPass)&&/[0-9]/.test(newPass)&&/[^a-zA-Z0-9]/.test(newPass)?"100%":newPass.length>=8&&/[0-9]/.test(newPass)?"70%":newPass.length>=6?"40%":"20%",
                      background:newPass.length>=10&&/[A-Z]/.test(newPass)&&/[0-9]/.test(newPass)?"#4ade80":newPass.length>=8?"#facc15":"#f87171"}}/>
                  </div>
                  <div style={{fontSize:10,color:C.muted,marginTop:3}}>
                    {newPass.length>=10&&/[A-Z]/.test(newPass)&&/[0-9]/.test(newPass)?"Strong ✓":newPass.length>=8?"Medium":"Weak — add numbers & uppercase"}
                  </div>
                </div>
              )}
              <Btn onClick={changePassword} full loading={saving}>Change Password 🔒</Btn>
            </Card>
            <div style={{marginTop:14,background:"#FFF8E1",borderRadius:12,padding:"12px 14px",fontSize:12,color:"#7a5800",lineHeight:1.8}}>
              ⚠️ After changing your password, you will remain logged in on this device. Other sessions will be signed out automatically.
            </div>
          </>
        )}

        {/* ── PIN ── */}
        {tab==="pin"&&(
          <>
            <Card style={{marginBottom:16,background:C.blueP,padding:16}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>🔢 Transaction PIN</div>
              <div style={{fontSize:12,color:C.muted,lineHeight:1.7}}>Your 4-digit PIN is required for all transfers and withdrawals. Never share it with anyone. Demo current PIN: <strong>1234</strong></div>
            </Card>
            <Card>
              <div style={{marginBottom:20}}>
                <div style={{fontSize:12,fontWeight:600,color:C.muted,marginBottom:10}}>CURRENT PIN</div>
                <PinPad value={curPin} onChange={sCurPin} maxLen={4}/>
              </div>
              {curPin.length===4&&(
                <>
                  <div style={{borderTop:`1px solid ${C.border}`,paddingTop:20,marginBottom:20}}>
                    <div style={{fontSize:12,fontWeight:600,color:C.muted,marginBottom:10}}>NEW PIN</div>
                    <PinPad value={newPin} onChange={sNewPin} maxLen={4}/>
                  </div>
                  {newPin.length===4&&(
                    <div style={{borderTop:`1px solid ${C.border}`,paddingTop:20,marginBottom:20}}>
                      <div style={{fontSize:12,fontWeight:600,color:C.muted,marginBottom:10}}>CONFIRM NEW PIN</div>
                      <PinPad value={confPin} onChange={sConfPin} maxLen={4}/>
                    </div>
                  )}
                  {newPin.length===4&&confPin.length===4&&(
                    <Btn onClick={changePin} full loading={saving} color={newPin===confPin?C.green:C.red}>
                      {newPin===confPin?"Confirm PIN Change ✓":"PINs do not match"}
                    </Btn>
                  )}
                </>
              )}
            </Card>
          </>
        )}

        {/* ── PREFERENCES ── */}
        {tab==="prefs"&&(
          <>
            <Card style={{marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>Security Preferences</div>
              {[
                {key:"twoFA",val:twoFA,set:sTwoFA,label:"Two-Factor Authentication",sub:"Require a code from your phone app on every login",color:C.green,icon:"🔐"},
                {key:"biometric",val:biometric,set:sBiometric,label:"Biometric Login",sub:"Use Face ID or fingerprint to log in",color:C.blue,icon:"👆"},
                {key:"loginAlerts",val:loginAlerts,set:sLoginAlerts,label:"Login Alerts",sub:"Get notified every time your account is accessed",color:C.navy,icon:"🔔"},
                {key:"txnAlerts",val:txnAlerts,set:sTxnAlerts,label:"Transaction Alerts",sub:"Get notified for every credit and debit",color:C.orange,icon:"💸"},
              ].map(item=>(
                <div key={item.key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"15px 0",borderBottom:`1px solid ${C.border}`}}>
                  <div style={{display:"flex",gap:12,alignItems:"center",flex:1}}>
                    <div style={{width:40,height:40,borderRadius:12,background:item.color+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{item.icon}</div>
                    <div><div style={{fontWeight:700,fontSize:13}}>{item.label}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{item.sub}</div></div>
                  </div>
                  <button onClick={()=>item.set(!item.val)}
                    style={{width:48,height:26,borderRadius:13,border:"none",cursor:"pointer",transition:"background .2s",background:item.val?item.color:C.border,position:"relative",flexShrink:0,marginLeft:12}}>
                    <div style={{width:20,height:20,borderRadius:10,background:"#fff",position:"absolute",top:3,transition:"left .2s",left:item.val?24:3,boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/>
                  </button>
                </div>
              ))}
            </Card>
            <Card style={{marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>Auto-Lock Timer</div>
              <Picker label="Lock app after inactivity" value={autoLock} onChange={sAutoLock} options={[{value:"1",label:"1 minute"},{value:"3",label:"3 minutes"},{value:"5",label:"5 minutes"},{value:"10",label:"10 minutes"},{value:"30",label:"30 minutes"},{value:"never",label:"Never (not recommended)"}]}/>
            </Card>
            <Btn onClick={savePrefs} full loading={saving}>Save Security Preferences</Btn>
            <div style={{marginTop:20,background:C.redP,borderRadius:12,padding:"14px 16px",fontSize:12,color:C.red,lineHeight:1.9}}>
              <strong>🚨 Suspect fraud?</strong><br/>
              Call us immediately: <strong>{BANK.phone}</strong><br/>
              Email: <strong>{BANK.email}</strong><br/>
              We will never ask for your PIN, password, or SSN by phone or email.
            </div>
          </>
        )}

      </div>
    </FullModal>
  );
}

/* Admin Client Detail Screen */
function AdminClientDetail({user,account,onBack,verifyUser,freezeUser,t$,sUsers,sAccounts}){
  const[tab,sTab]=useState("profile");
  const[acct,sAcct]=useState({...account});
  const[adjType,sAdjType]=useState("credit");
  const[adjAmt,sAdjAmt]=useState("");
  const[adjReason,sAdjReason]=useState("Admin Correction");
  const[saving,sSaving]=useState(false);
  const[editBal,sEditBal]=useState(false);
  const[directBal,sDirectBal]=useState(String(account?.balance||0));
  const[directSav,sDirectSav]=useState(String(account?.savings||0));
  const[directLoan,sDirectLoan]=useState(String(account?.loan_balance||0));

  const fields=[
    ["Full Name",user.full_name||`${user.first_name} ${user.last_name}`],
    ["Email",user.email],["Phone",user.phone||"—"],
    ["Date of Birth",user.dob||"—"],["SSN Last 4",user.ssn_last4?"●●●●-"+user.ssn_last4:"—"],
    ["Address",user.address?`${user.address}, ${user.city}, ${user.state} ${user.zip}`:"—"],
    ["ID Type",user.id_type||"—"],["ID Number",user.id_number||"—"],
    ["Employment",user.employment||"—"],["Annual Income",user.annual_income||"—"],
    ["Account No.",user.account_number],["Routing",user.routing_number||BANK.routing],
    ["Account Type",user.account_type],
    ["KYC Status",user.kyc_status],["Profile",`${user.profile_complete||0}% complete`],
    ["Member Since",user.created_at],
  ];

  /* Manual adjustment (credit or debit) — creates a transaction record */
  async function makeAdjustment(){
    const n=parseFloat(adjAmt);
    if(!n||n<=0)return t$("Enter a valid amount","error");
    if(adjType==="debit"&&n>acct.balance)return t$("Amount exceeds current balance","error");
    if(!adjReason.trim())return t$("Enter a reason for this adjustment","error");
    sSaving(true);
    try{
      const newBal=adjType==="credit"?acct.balance+n:acct.balance-n;
      await DS.updateAccount(acct.id,{balance:newBal});
      /* Log as a transaction */
      const txn={id:uid(),user_id:user.id,type:adjType,category:"admin_adjustment",
        description:`Admin ${adjType==="credit"?"Credit":"Debit"} — ${adjReason}`,
        amount:n,currency:"USD",reference:genRef(),status:"success",created_at:nowStr()};
      if(IS_DEMO)DEMO.transactions.unshift(txn);
      else await fbDB.collection("transactions").add(txn);
      /* Notify user */
      await DS.addNotif(user.id,`${adjType==="credit"?"Credit":"Debit"} of ${fmt(n)} applied to your account. Reason: ${adjReason}.`,adjType==="credit"?"success":"info");
      sAcct(prev=>({...prev,balance:newBal}));
      if(sAccounts)sAccounts(prev=>prev.map(a=>a.id===acct.id?{...a,balance:newBal}:a));
      t$(`${fmt(n)} ${adjType==="credit"?"credited to":"debited from"} ${user.full_name}'s account`);
      sAdjAmt("");sAdjReason("Admin Correction");
    }catch(e){t$("Adjustment failed: "+e.message,"error");}
    sSaving(false);
  }

  /* Direct balance override — sets exact values */
  async function saveDirectEdit(){
    const newBal=parseFloat(directBal)||0;
    const newSav=parseFloat(directSav)||0;
    const newLoan=parseFloat(directLoan)||0;
    sSaving(true);
    try{
      await DS.updateAccount(acct.id,{balance:newBal,savings:newSav,loan_balance:newLoan});
      const diff=newBal-acct.balance;
      if(diff!==0){
        const txn={id:uid(),user_id:user.id,type:diff>0?"credit":"debit",category:"admin_adjustment",
          description:`Admin Balance Correction — ${diff>0?"increase":"decrease"} of ${fmt(Math.abs(diff))}`,
          amount:Math.abs(diff),currency:"USD",reference:genRef(),status:"success",created_at:nowStr()};
        if(IS_DEMO)DEMO.transactions.unshift(txn);
        else await fbDB.collection("transactions").add(txn);
        await DS.addNotif(user.id,`Your account balance has been updated by Bypay Bank. New balance: ${fmt(newBal)}.`,"info");
      }
      sAcct(prev=>({...prev,balance:newBal,savings:newSav,loan_balance:newLoan}));
      if(sAccounts)sAccounts(prev=>prev.map(a=>a.id===acct.id?{...a,balance:newBal,savings:newSav,loan_balance:newLoan}:a));
      sEditBal(false);
      t$("Account balances updated successfully!");
    }catch(e){t$("Save failed: "+e.message,"error");}
    sSaving(false);
  }

  const TABS=[{id:"profile",l:"👤 Profile"},{id:"balance",l:"💰 Balance"},{id:"adjust",l:"⚙️ Adjust"}];

  return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title="Client Management" left={<IBtn icon="←" onClick={onBack}/>}/>
        {/* Tab bar */}
        <div style={{display:"flex",gap:3,padding:"8px 14px 12px"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>sTab(t.id)}
              style={{flex:1,padding:"9px 4px",borderRadius:10,border:"none",background:tab===t.id?"rgba(255,255,255,0.18)":"transparent",color:tab===t.id?"#fff":"rgba(255,255,255,0.5)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit",transition:"all .15s"}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:16}}>

        {/* ── PROFILE TAB ── */}
        {tab==="profile"&&(
          <>
            <Card style={{marginBottom:14,textAlign:"center",padding:22}}>
              <div style={{width:64,height:64,borderRadius:18,background:C.blueP,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,fontWeight:800,color:C.blue,margin:"0 auto 12px"}}>{(user.first_name?.[0]||"?")+""+(user.last_name?.[0]||"")}</div>
              <div style={{fontWeight:700,fontSize:18,marginBottom:4}}>{user.full_name||`${user.first_name} ${user.last_name}`}</div>
              <div style={{fontSize:13,color:C.muted,marginBottom:10}}>{user.email}</div>
              <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
                <KYCBadge status={user.kyc_status}/>
                <span style={{background:user.status==="active"?C.greenP:C.redP,color:user.status==="active"?C.green:C.red,borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700,textTransform:"capitalize"}}>{user.status}</span>
                <span style={{background:C.bg,color:C.navy,borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700}}>{user.account_type}</span>
              </div>
            </Card>
            <Card style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Full Profile Details</div>
              {fields.map(([k,v])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                  <span style={{fontSize:12,color:C.muted,flexShrink:0,marginRight:8}}>{k}</span>
                  <span style={{fontSize:12,fontWeight:600,textAlign:"right",wordBreak:"break-all",maxWidth:"60%",textTransform:"capitalize"}}>{v}</span>
                </div>
              ))}
            </Card>
            <div style={{display:"flex",gap:10}}>
              <Btn onClick={()=>{verifyUser(user);}} full color={user.kyc_status==="verified"?C.muted:C.green} sm>{user.kyc_status==="verified"?"Revoke KYC":"Verify KYC ✓"}</Btn>
              <Btn onClick={()=>{freezeUser(user);}} full color={user.status==="frozen"?C.green:C.red} danger={user.status!=="frozen"} sm>{user.status==="frozen"?"Unfreeze 🔓":"Freeze 🔒"}</Btn>
            </div>
          </>
        )}

        {/* ── BALANCE TAB ── */}
        {tab==="balance"&&(
          <>
            {/* Current balances display */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
              {[["Checking",fmt(acct.balance),C.blue,"💰"],["Savings",fmt(acct.savings),C.green,"🐖"],["Loan Bal.",fmt(acct.loan_balance),C.orange,"🏛"]].map(([l,v,c,i])=>(
                <Card key={l} style={{textAlign:"center",padding:14}}>
                  <div style={{fontSize:20,marginBottom:6}}>{i}</div>
                  <div style={{fontWeight:800,fontSize:15,color:c,marginBottom:3}}>{v}</div>
                  <div style={{fontSize:10,color:C.muted}}>{l}</div>
                </Card>
              ))}
            </div>

            {/* Direct edit mode */}
            {editBal?(
              <Card style={{marginBottom:14,border:`2px solid ${C.orange}`}}>
                <div style={{fontWeight:700,fontSize:15,marginBottom:4,color:C.orange}}>⚠️ Direct Balance Override</div>
                <div style={{fontSize:12,color:C.muted,marginBottom:16,lineHeight:1.7}}>This sets the exact balance directly. A correction transaction will be logged automatically.</div>
                <Input label="Checking Balance ($)" value={directBal} onChange={sDirectBal} keyboardType="number" icon="$" note={`Current: ${fmt(acct.balance)}`}/>
                <Input label="Savings Balance ($)" value={directSav} onChange={sDirectSav} keyboardType="number" icon="$" note={`Current: ${fmt(acct.savings)}`}/>
                <Input label="Loan Balance ($)" value={directLoan} onChange={sDirectLoan} keyboardType="number" icon="$" note={`Current: ${fmt(acct.loan_balance)}`}/>
                <div style={{display:"flex",gap:10,marginTop:4}}>
                  <Btn onClick={saveDirectEdit} full color={C.orange} loading={saving} sm>Save Balances</Btn>
                  <Btn onClick={()=>{sEditBal(false);sDirectBal(String(acct.balance));sDirectSav(String(acct.savings));sDirectLoan(String(acct.loan_balance));}} ghost full color={C.muted} sm>Cancel</Btn>
                </div>
              </Card>
            ):(
              <Card style={{marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:15,marginBottom:6}}>Edit Balances Directly</div>
                <div style={{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.7}}>Set exact balance values for checking, savings, or loan balance. All changes are logged as correction transactions.</div>
                <Btn onClick={()=>sEditBal(true)} full color={C.orange}>✏️ Edit Account Balances</Btn>
              </Card>
            )}

            {/* Account info */}
            <Card>
              <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Account Information</div>
              {[["Account Number",user.account_number],["Routing Number",user.routing_number||BANK.routing],["Account Type",user.account_type],["Currency","USD"],["Account Status",acct.status],["FDIC Insured","Yes — Up to $250,000"]].map(([k,v])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                  <span style={{fontSize:13,color:C.muted}}>{k}</span>
                  <span style={{fontSize:13,fontWeight:600}}>{v}</span>
                </div>
              ))}
            </Card>
          </>
        )}

        {/* ── ADJUST TAB ── */}
        {tab==="adjust"&&(
          <>
            {/* Current balance */}
            <Card style={{marginBottom:16,background:`linear-gradient(135deg,${C.navy},${C.navyM})`,padding:20}}>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:4}}>Current Checking Balance</div>
              <div style={{fontFamily:"serif",fontSize:32,fontWeight:700,color:"#fff",marginBottom:2}}>{fmt(acct.balance)}</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.45)"}}>{user.full_name} · {user.account_number}</div>
            </Card>

            {/* Manual adjustment */}
            <Card style={{marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>Manual Adjustment</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:16,lineHeight:1.7}}>Credit or debit the account with a specific amount. A transaction record and client notification will be created automatically.</div>

              {/* Credit / Debit toggle */}
              <div style={{display:"flex",gap:8,marginBottom:18}}>
                <button onClick={()=>sAdjType("credit")} style={{flex:1,padding:"12px 8px",borderRadius:14,border:`2px solid ${adjType==="credit"?C.green:C.border}`,background:adjType==="credit"?C.greenP:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"inherit",color:adjType==="credit"?C.green:C.muted}}>
                  ⬆️ Credit
                </button>
                <button onClick={()=>sAdjType("debit")} style={{flex:1,padding:"12px 8px",borderRadius:14,border:`2px solid ${adjType==="debit"?C.red:C.border}`,background:adjType==="debit"?C.redP:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"inherit",color:adjType==="debit"?C.red:C.muted}}>
                  ⬇️ Debit
                </button>
              </div>

              <Input label="Amount ($)" value={adjAmt} onChange={sAdjAmt} placeholder="Enter amount" keyboardType="number" icon="$"/>

              <Picker label="Reason for Adjustment" value={adjReason} onChange={sAdjReason} options={[
                "Admin Correction","Error Reversal","Fee Waiver","Duplicate Transaction Refund",
                "Fraud Reversal","Promotional Credit","Chargeback","Compliance Adjustment",
                "Interest Correction","Other"
              ]}/>

              {adjAmt&&parseFloat(adjAmt)>0&&(
                <div style={{background:adjType==="credit"?C.greenP:C.redP,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
                  <div style={{fontWeight:700,fontSize:13,color:adjType==="credit"?C.green:C.red,marginBottom:4}}>
                    {adjType==="credit"?"✓ After Credit:":"✓ After Debit:"}
                  </div>
                  <div style={{fontSize:20,fontWeight:800,color:adjType==="credit"?C.green:C.red}}>
                    {fmt(adjType==="credit"?acct.balance+parseFloat(adjAmt):Math.max(0,acct.balance-parseFloat(adjAmt)))}
                  </div>
                  <div style={{fontSize:12,color:C.muted,marginTop:2}}>New balance after adjustment</div>
                </div>
              )}

              <Btn onClick={makeAdjustment} full color={adjType==="credit"?C.green:C.red} loading={saving} danger={adjType==="debit"}>
                {adjType==="credit"?"Credit Account ⬆️":"Debit Account ⬇️"}
              </Btn>
            </Card>

            {/* Quick adjustments */}
            <Card style={{marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:12}}>Quick Credit Amounts</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {[10,25,50,100,250,500,1000,5000].map(v=>(
                  <button key={v} onClick={()=>{sAdjAmt(String(v));sAdjType("credit");}} style={{padding:"9px 16px",borderRadius:10,border:`1.5px solid ${parseFloat(adjAmt)===v&&adjType==="credit"?C.green:C.border}`,background:parseFloat(adjAmt)===v&&adjType==="credit"?C.greenP:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",color:parseFloat(adjAmt)===v&&adjType==="credit"?C.green:C.text}}>${v}</button>
                ))}
              </div>
            </Card>

            {/* Warning */}
            <div style={{background:"#FFF8E1",border:`1px solid ${C.gold}55`,borderRadius:14,padding:"14px 16px",fontSize:12,color:"#7a5800",lineHeight:1.9}}>
              ⚠️ <strong>Admin Action Notice:</strong> All balance changes are logged as transactions and the client is notified automatically. Ensure adjustments comply with {BANK.name} policies and applicable US banking regulations.
            </div>
          </>
        )}

      </div>
    </FullModal>
  );
}

/* ══════════════════════════════════════════════════════
   DATABASE SETTINGS SCREEN  (Full Admin Tool)
══════════════════════════════════════════════════════ */
function DatabaseScreen({users,accounts,txns,loans,notifs,t$,onBack}){
  const[tab,sTab]=useState("connection");
  const[selCol,sSelCol]=useState("users");
  const[selRecord,sSelRecord]=useState(null);
  const[editForm,sEditForm]=useState({});
  const[saving,sSaving]=useState(false);
  const[srch,sSrch]=useState("");
  const[filter,sFilter]=useState("all");
  const[importText,sImportText]=useState("");
  const[fbConfig,setFbConfig]=useState({
    apiKey: IS_DEMO?"Not connected — paste your Firebase config in index.html":"●●●●●●●●●●●●●●●●●●●●",
    projectId: IS_DEMO?"bypay-bank (demo)":"chinonso-bank",
    authDomain: IS_DEMO?"Not connected":"bypay-bank.firebaseapp.com",
    storageBucket: IS_DEMO?"Not connected":"bypay-bank.appspot.com",
  });

  /* All collections data */
  const COLLECTIONS={
    users:{label:"👥 Users",data:users,color:C.blue,
      fields:["id","full_name","email","phone","account_type","kyc_status","status","dob","created_at"]},
    accounts:{label:"🏦 Accounts",data:accounts,color:C.green,
      fields:["id","user_id","currency","balance","savings","loan_balance","status"]},
    transactions:{label:"📋 Transactions",data:txns,color:C.navy,
      fields:["id","user_id","type","category","amount","description","status","created_at"]},
    loans:{label:"🏛 Loans",data:loans,color:C.orange,
      fields:["id","user_id","amount","outstanding","monthly_payment","interest_rate","status","purpose"]},
    notifications:{label:"🔔 Notifications",data:notifs,color:"#8B5CF6",
      fields:["id","user_id","message","type","read_status","created_at"]},
  };

  const col=COLLECTIONS[selCol];
  const userMap=Object.fromEntries(users.map(u=>[u.id,u.full_name||u.first_name||u.id]));

  /* Filter records by search */
  const filteredData=col.data.filter(r=>{
    if(!srch)return true;
    return JSON.stringify(r).toLowerCase().includes(srch.toLowerCase());
  });

  /* Export collection as CSV */
  function exportCSV(collection,data){
    if(!data||data.length===0)return t$("No data to export","error");
    const fields=Object.keys(data[0]);
    const header=fields.join(",");
    const rows=data.map(r=>fields.map(f=>`"${String(r[f]||"").replace(/"/g,'""')}"`).join(","));
    const csv=[header,...rows].join("
");
    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`bypay_${collection}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();URL.revokeObjectURL(url);
    t$(`${data.length} ${collection} records exported as CSV!`);
  }

  /* Export all as JSON */
  function exportAllJSON(){
    const allData={
      exported_at:new Date().toISOString(),
      bank:BANK.name,
      collections:{
        users,accounts,transactions:txns,loans,notifications:notifs
      }
    };
    const blob=new Blob([JSON.stringify(allData,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`bypay_full_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);
    t$("Full database exported as JSON!");
  }

  /* Open record for editing */
  function openRecord(record){
    sSelRecord(record);
    sEditForm({...record});
  }

  /* Save edited record */
  async function saveRecord(){
    sSaving(true);
    try{
      if(selCol==="users") await DS.updateUser(editForm.id,editForm);
      else if(selCol==="accounts") await DS.updateAccount(editForm.id,editForm);
      else if(selCol==="loans") await DS.updateLoan(editForm.id,editForm);
      /* Update in-memory for demo */
      if(IS_DEMO){
        const arr=DEMO[selCol==="transactions"?"transactions":selCol];
        if(arr){const idx=arr.findIndex(r=>r.id===editForm.id);if(idx>-1)Object.assign(arr[idx],editForm);}
      }
      t$("Record saved successfully!");
      sSelRecord(null);
    }catch(e){t$("Save failed: "+e.message,"error");}
    sSaving(false);
  }

  const DB_TABS=[
    {id:"connection",l:"🔌 Connection"},
    {id:"browse",l:"📂 Browse"},
    {id:"backup",l:"💾 Backup"},
    {id:"maintenance",l:"🔧 Maintenance"},
  ];

  /* Record edit modal */
  if(selRecord)return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title={`Edit ${selCol.slice(0,-1)} record`} left={<IBtn icon="←" onClick={()=>sSelRecord(null)}/>}/>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:16}}>
        <div style={{background:"#FFF8E1",border:`1px solid ${C.gold}44`,borderRadius:12,padding:"12px 14px",marginBottom:16,fontSize:12,color:"#7a5800",lineHeight:1.7}}>
          ⚠️ <strong>Direct Record Edit.</strong> Changes update the database immediately. Ensure all values are correct before saving.
        </div>
        <Card>
          <div style={{fontFamily:"monospace",fontSize:10,color:C.muted,marginBottom:12,wordBreak:"break-all"}}>ID: {editForm.id}</div>
          {Object.entries(editForm).filter(([k])=>k!=="id"&&k!=="password_hash"&&k!=="pin_hash").map(([k,v])=>(
            <div key={k} style={{marginBottom:12}}>
              <div style={{fontSize:10,fontWeight:700,color:C.muted,marginBottom:4,letterSpacing:.8,textTransform:"uppercase"}}>{k.replace(/_/g," ")}</div>
              {typeof v==="boolean"?(
                <button onClick={()=>sEditForm(f=>({...f,[k]:!f[k]}))}
                  style={{padding:"8px 18px",borderRadius:10,border:`1.5px solid ${v?C.green:C.border}`,background:v?C.greenP:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",color:v?C.green:C.muted}}>
                  {v?"True":"False"}
                </button>
              ):(
                <input value={String(v||"")} onChange={e=>sEditForm(f=>({...f,[k]:e.target.value}))}
                  style={{width:"100%",padding:"10px 12px",border:`1.5px solid ${C.border}`,borderRadius:10,fontSize:14,outline:"none",fontFamily:"monospace",background:C.bg,color:C.text}}/>
              )}
            </div>
          ))}
        </Card>
        <div style={{display:"flex",gap:10,marginTop:16}}>
          <Btn onClick={saveRecord} full loading={saving} color={C.green}>Save Changes ✓</Btn>
          <Btn onClick={()=>sSelRecord(null)} ghost full color={C.muted}>Cancel</Btn>
        </div>
      </div>
    </FullModal>
  );

  return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title="Database Settings" left={<IBtn icon="←" onClick={onBack}/>}/>
        <div style={{display:"flex",gap:3,padding:"8px 12px 12px",overflowX:"auto"}}>
          {DB_TABS.map(t=>(
            <button key={t.id} onClick={()=>sTab(t.id)}
              style={{whiteSpace:"nowrap",padding:"8px 14px",borderRadius:10,border:"none",background:tab===t.id?"rgba(255,255,255,0.18)":"transparent",color:tab===t.id?"#fff":"rgba(255,255,255,0.5)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:16}}>

        {/* ══ CONNECTION ══ */}
        {tab==="connection"&&(
          <>
            {/* Status card */}
            <Card style={{marginBottom:14,background:`linear-gradient(135deg,${IS_DEMO?C.orange:C.green},${IS_DEMO?"#ea580c":"#065f46"})`,padding:20}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div>
                  <div style={{fontSize:12,color:"rgba(255,255,255,0.6)",marginBottom:4}}>Database Status</div>
                  <div style={{fontWeight:800,fontSize:24,color:"#fff"}}>{IS_DEMO?"Demo Mode":"Connected ✓"}</div>
                </div>
                <div style={{fontSize:48}}>{IS_DEMO?"⚠️":"✅"}</div>
              </div>

function AdminSecurityPanel({users,accounts,txns,loans,notifs,t$,admin}){
  const[secTab,sSecTab]=useState("overview");
  const[dbScreen,sDbScreen]=useState(false);
  const[settings,sSettings]=useState({
    session_timeout:"30",
    max_login_attempts:"5",
    require_2fa:false,
    ip_whitelist_enabled:false,
    ip_whitelist:"",
    auto_lock_accounts:true,
    min_password_length:"8",
    require_strong_password:true,
    audit_log_retention:"90",
    data_backup:"daily",
    maintenance_mode:false,
    allow_new_registrations:true,
    transfer_daily_limit:"25000",
    max_loan_amount:"50000",
    savings_interest_rate:"4.50",
    loan_interest_rate:"8.99",
    fdic_coverage:"250000",
  });
  const[saving,sSaving]=useState(false);
  const[adminPass,sAdminPass]=useState("");
  const[newAdminPass,sNewAdminPass]=useState("");
  const[confAdminPass,sConfAdminPass]=useState("");

  /* Safe to do conditional return here — all hooks declared above */
  if(dbScreen)return <DatabaseScreen users={users} accounts={accounts} txns={txns} loans={loans} notifs={notifs||[]} t$={t$} onBack={()=>sDbScreen(false)}/>;

  function upd(k,v){sSettings(s=>({...s,[k]:v}));}

  async function saveSettings(){
    sSaving(true);
    await new Promise(r=>setTimeout(r,800)); /* simulate save */
    t$("Settings saved successfully!");
    sSaving(false);
  }

  async function changeAdminPass(){
    if(!adminPass)return t$("Enter current password","error");
    if(newAdminPass.length<8)return t$("Min 8 characters","error");
    if(newAdminPass!==confAdminPass)return t$("Passwords do not match","error");
    sSaving(true);
    try{
      if(!IS_DEMO){
        const u=fbAuth.currentUser;
        const cred=firebase.auth.EmailAuthProvider.credential(admin.email,adminPass);
        await u.reauthenticateWithCredential(cred);
        await u.updatePassword(newAdminPass);
      } else {
        if(adminPass!=="admin123")throw new Error("Current password incorrect. Demo: admin123");
      }
      sAdminPass("");sNewAdminPass("");sConfAdminPass("");
      t$("Admin password changed successfully!");
    }catch(e){
      t$(e.message||"Password change failed","error");
    }
    sSaving(false);
  }

  /* DB stats */
  const DB_STATS=[
    {col:"users",count:users.length,icon:"👥",color:C.blue},
    {col:"accounts",count:accounts.length,icon:"🏦",color:C.green},
    {col:"transactions",count:txns.length,icon:"📋",color:C.navy},
    {col:"loans",count:loans.length,icon:"🏛",color:C.orange},
    {col:"notifications",count:0,icon:"🔔",color:"#8B5CF6"},
    {col:"beneficiaries",count:0,icon:"👤",color:C.muted},
  ];

  /* Audit log (demo) */
  const AUDIT_LOG=[
    {action:"Client KYC Verified",user:"Sarah Johnson",admin:admin.name,time:"Today 9:14 AM",type:"success"},
    {action:"Account Balance Adjusted",user:"Marcus Thompson",admin:admin.name,time:"Today 9:30 AM",type:"warning"},
    {action:"Account Frozen",user:"Marcus Thompson",admin:admin.name,time:"Yesterday 3:22 PM",type:"alert"},
    {action:"Admin Login",user:"—",admin:admin.name,time:"Yesterday 3:20 PM",type:"info"},
    {action:"Broadcast Notification Sent",user:"All Users",admin:admin.name,time:"2 days ago",type:"info"},
    {action:"Admin Login",user:"—",admin:admin.name,time:"3 days ago",type:"info"},

function App(){
  const[phase,sPhase]=useState("splash");
  const[session,sSession]=useState(null);

  useEffect(()=>{
    if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
    const t=setTimeout(()=>{
      let seen=false;try{seen=localStorage.getItem("bypay_seen");}catch(e){}
      sPhase(seen?"auth":"onboard");
    },2200);
    return()=>clearTimeout(t);
  },[]);

  function onLogin(r){sSession(r);sPhase(r.type==="admin"?"admin":"client");}
  function onLogout(){sSession(null);sPhase("auth");}

  if(phase==="splash")return <SplashScreen/>;
  if(phase==="onboard")return <OnboardScreen onDone={()=>{try{localStorage.setItem("bypay_seen","1");}catch(e){};sPhase("auth");}}/>;
  if(phase==="auth")return <AuthScreen onLogin={onLogin}/>;
  if(phase==="client"&&session)return <ClientApp initUser={session.user} initAccount={session.account} onLogout={onLogout}/>;
  if(phase==="admin"&&session)return <AdminApp admin={session.admin} onLogout={onLogout}/>;
  return <AuthScreen onLogin={onLogin}/>;
}

const preLoader=document.getElementById("pre-loader");
if(preLoader)preLoader.style.display="none";
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
