/* ══════════════════════════════════════════════════════
   DATA SERVICE
══════════════════════════════════════════════════════ */
const DS={
  async login(email,pass,admin=false){
    if(IS_DEMO){
      if(admin){const a=DEMO.admin_users.find(x=>x.email===email&&x.password_hash===hashP(pass));if(!a)throw new Error("Invalid credentials");return{type:"admin",admin:a};}
      const u=DEMO.users.find(x=>x.email===email&&x.password_hash===hashP(pass)&&x.status==="active");
      if(!u)throw new Error("Incorrect email or password");
      const acct=DEMO.accounts.find(a=>a.user_id===u.id);
      return{type:"client",user:{...u},account:{...acct}};
    }
    const c=await fbAuth.signInWithEmailAndPassword(email,pass);
    const uid2=c.user.uid;
    if(admin){const s=await fbDB.collection("admin_users").doc(uid2).get();if(!s.exists)throw new Error("Admin not found");return{type:"admin",admin:{id:uid2,...s.data()}};}
    try{
      const[us,as]=await Promise.all([fbDB.collection("users").doc(uid2).get(),fbDB.collection("accounts").where("user_id","==",uid2).limit(1).get()]);
      const a=as.docs[0];
      return{type:"client",user:{id:uid2,...us.data()},account:{id:a?.id,...a?.data()}};
    }catch(e){throw new Error("Logged in but data failed to load. Open from GitHub Pages. ("+e.message+")");}
  },
  async register(first_name,last_name,email,phone,pass){
    const acct_no=genAcct();
    const u={first_name,last_name,full_name:`${first_name} ${last_name}`,email,phone,password_hash:hashP(pass),account_number:acct_no,routing_number:BANK.routing,account_type:"Checking",status:"active",kyc_status:"pending",dob:"",ssn_last4:"",address:"",city:"",state:"",zip:"",id_type:"",id_number:"",employment:"",annual_income:"",created_at:today(),profile_complete:30};
    const a={currency:"USD",balance:0,savings:0,loan_balance:0,status:"active"};
    if(IS_DEMO){
      if(DEMO.users.find(x=>x.email===email))throw new Error("Email already registered");
      const id=uid();u.id=id;a.user_id=id;a.id=uid();
      DEMO.users.push(u);DEMO.accounts.push(a);
      return{type:"client",user:{...u},account:{...a}};
    }
    const c=await fbAuth.createUserWithEmailAndPassword(email,pass);
    const uid2=c.user.uid;
    a.user_id=uid2;
    try{
      const ar=await fbDB.collection("accounts").add(a);
      await fbDB.collection("users").doc(uid2).set(u);
      return{type:"client",user:{id:uid2,...u},account:{id:ar.id,...a}};
    }catch(e){throw new Error("Account created but setup failed. Check Firestore Rules. ("+e.message+")");}
  },
  async logout(){if(!IS_DEMO)try{await fbAuth.signOut();}catch(e){}},
  async addTxn(user_id,type,category,description,amount){
    const t={id:uid(),user_id,type,category,description,amount,currency:"USD",reference:genRef(),status:"success",created_at:nowStr()};
    if(IS_DEMO){DEMO.transactions.unshift(t);}
    else{
      await fbDB.collection("transactions").add(t);
      const s=await fbDB.collection("accounts").where("user_id","==",user_id).limit(1).get();
      if(!s.empty){const d=s.docs[0];await d.ref.update({balance:d.data().balance+(type==="credit"?amount:-amount)});}
    }
    await DS.addNotif(user_id,`${type==="credit"?"Credit":"Debit"}: ${fmt(amount)} — ${description}. Ref: ${t.reference}`,type==="credit"?"success":"info");
    return t;
  },
  async getTxns(uid){
    if(IS_DEMO)return DEMO.transactions.filter(t=>t.user_id===uid);
    const s=await fbDB.collection("transactions").where("user_id","==",uid).limit(60).get();
    return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  },
  async getAllTxns(){
    if(IS_DEMO)return[...DEMO.transactions].sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
    const s=await fbDB.collection("transactions").limit(300).get();
    return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  },
  async addNotif(user_id,message,type="info"){
    const n={id:uid(),user_id,message,type,read_status:0,created_at:nowStr()};
    if(IS_DEMO)DEMO.notifications.unshift(n);
    else await fbDB.collection("notifications").add(n);
    return n;
  },
  async getNotifs(uid){
    if(IS_DEMO)return DEMO.notifications.filter(n=>n.user_id===uid);
    const s=await fbDB.collection("notifications").where("user_id","==",uid).limit(30).get();
    return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  },
  async getAllNotifs(){
    if(IS_DEMO)return[...DEMO.notifications].sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
    const s=await fbDB.collection("notifications").limit(200).get();
    return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  },
  async markNotifRead(id){if(IS_DEMO){const n=DEMO.notifications.find(n=>n.id===id);if(n)n.read_status=1;}else await fbDB.collection("notifications").doc(id).update({read_status:1});},
  async updateUser(id,p){
    if(IS_DEMO){const u=DEMO.users.find(u=>u.id===id);if(u)Object.assign(u,p);}
    else await fbDB.collection("users").doc(id).update(p);
  },
  async updateAccount(id,p){
    if(IS_DEMO){const a=DEMO.accounts.find(a=>a.id===id);if(a)Object.assign(a,p);}
    else await fbDB.collection("accounts").doc(id).update(p);
  },
  async getAllUsers(){if(IS_DEMO)return[...DEMO.users];const s=await fbDB.collection("users").get();return s.docs.map(d=>({id:d.id,...d.data()}));},
  async getAllAccounts(){if(IS_DEMO)return[...DEMO.accounts];const s=await fbDB.collection("accounts").get();return s.docs.map(d=>({id:d.id,...d.data()}));},
  async getLoans(uid){if(IS_DEMO)return DEMO.loans.filter(l=>l.user_id===uid);const s=await fbDB.collection("loans").where("user_id","==",uid).get();return s.docs.map(d=>({id:d.id,...d.data()}));},
  async getAllLoans(){if(IS_DEMO)return[...DEMO.loans];const s=await fbDB.collection("loans").get();return s.docs.map(d=>({id:d.id,...d.data()}));},
  async addLoan(l){if(IS_DEMO)DEMO.loans.push(l);else await fbDB.collection("loans").add(l);return l;},
  async updateLoan(id,p){if(IS_DEMO){const l=DEMO.loans.find(l=>l.id===id);if(l)Object.assign(l,p);}else await fbDB.collection("loans").doc(id).update(p);},
  async getGoals(uid){if(IS_DEMO)return DEMO.savings_goals.filter(g=>g.user_id===uid);const s=await fbDB.collection("savings_goals").where("user_id","==",uid).get();return s.docs.map(d=>({id:d.id,...d.data()}));},
  async addGoal(g){if(IS_DEMO)DEMO.savings_goals.push(g);else await fbDB.collection("savings_goals").add(g);return g;},
  async updateGoal(id,p){if(IS_DEMO){const g=DEMO.savings_goals.find(g=>g.id===id);if(g)Object.assign(g,p);}else await fbDB.collection("savings_goals").doc(id).update(p);},
  async getBenes(uid){if(IS_DEMO)return DEMO.beneficiaries.filter(b=>b.user_id===uid);const s=await fbDB.collection("beneficiaries").where("user_id","==",uid).get();return s.docs.map(d=>({id:d.id,...d.data()}));},
  async addBene(b){if(IS_DEMO)DEMO.beneficiaries.push(b);else await fbDB.collection("beneficiaries").add(b);return b;},
  async delBene(id){if(IS_DEMO){const i=DEMO.beneficiaries.findIndex(b=>b.id===id);if(i>-1)DEMO.beneficiaries.splice(i,1);}else await fbDB.collection("beneficiaries").doc(id).delete();},
  async lookupAcct(acct_no){
    if(IS_DEMO){const u=DEMO.users.find(u=>u.account_number===acct_no);return u?{found:true,name:u.full_name,user_id:u.id}:{found:false};}
    const s=await fbDB.collection("users").where("account_number","==",acct_no).limit(1).get();
    if(s.empty)return{found:false};const d=s.docs[0];return{found:true,name:d.data().full_name||d.data().name,user_id:d.id};
  },
};

function PinPad({value,onChange,maxLen=4}){
  const keys=["1","2","3","4","5","6","7","8","9","","0","⌫"];
  return(
    <div>
      <div style={{display:"flex",justifyContent:"center",gap:20,marginBottom:30}}>
        {Array.from({length:maxLen}).map((_,i)=>(
          <div key={i} style={{width:16,height:16,borderRadius:8,background:i<value.length?C.navy:C.border,transition:"background .15s"}}/>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        {keys.map((k,i)=>(
          <button key={i} onClick={()=>{if(k==="⌫")onChange(value.slice(0,-1));else if(k&&value.length<maxLen)onChange(value+k);}}
            style={{height:62,borderRadius:14,background:k?"#fff":C.bg,border:`1.5px solid ${k?C.border:"transparent"}`,fontSize:k==="⌫"?20:22,fontWeight:k==="⌫"?400:600,color:C.text,cursor:k?"pointer":"default",fontFamily:"inherit",boxShadow:k?"0 1px 6px rgba(10,36,99,0.07)":undefined}}>
            {k}
          </button>
        ))}
      </div>
    </div>
  );
}
function AmountKey({value,onChange}){
  const keys=["1","2","3","4","5","6","7","8","9",".","0","⌫"];
  function press(k){
    if(k==="⌫"){onChange(value.slice(0,-1)||"");return;}
    if(k==="."&&value.includes("."))return;
    if(k==="."&&!value)return onChange("0.");
    const parts=(value+k).split(".");
    if(parts[1]&&parts[1].length>2)return;
    onChange(value+k);
  }
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:2}}>
      {keys.map((k,i)=>(
        <button key={i} onClick={()=>press(k)}
          style={{height:58,background:"transparent",border:"none",fontSize:k==="⌫"?20:22,fontWeight:600,color:C.text,cursor:"pointer",fontFamily:"inherit",borderRadius:10,transition:"background .1s"}}
          onTouchStart={e=>e.currentTarget.style.background=C.border}
          onTouchEnd={e=>e.currentTarget.style.background="transparent"}>
          {k}
        </button>
      ))}
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   AUTH SCREEN
══════════════════════════════════════════════════════ */
function AuthScreen({onLogin,defaultTab="login"}){
  const[tab,sTab]=useState(
    (typeof window!=="undefined"&&window.location.search.includes("admin"))?"admin":defaultTab
  );
  const[logoTaps,sLogoTaps]=useState(0);
  const[tapTimer,sTapTimer]=useState(null);
  const[firstName,sFirst]=useState("");
  const[lastName,sLast]=useState("");
  const[email,sEmail]=useState("");
  const[phone,sPhone]=useState("");
  const[pass,sPass]=useState("");
  const[err,sErr]=useState("");
  const[loading,sLoad]=useState(false);

  function tapLogo(){
    const n=logoTaps+1;sLogoTaps(n);
    if(tapTimer)clearTimeout(tapTimer);
    const t=setTimeout(()=>sLogoTaps(0),2000);sTapTimer(t);
    if(n>=7){sTab("admin");sLogoTaps(0);sErr("");}
  }

  async function submit(){
    sErr("");sLoad(true);
    try{
      if(tab==="login"){
        if(!email||!pass)throw new Error("Please fill in all fields");
        onLogin(await DS.login(email,pass));
      } else if(tab==="admin"){
        if(!email||!pass)throw new Error("Please fill in all fields");
        onLogin(await DS.login(email,pass,true));
      } else {
        if(!firstName||!lastName||!email||!phone||!pass)throw new Error("All fields are required");
        if(pass.length<6)throw new Error("Password must be at least 6 characters");
        onLogin(await DS.register(firstName,lastName,email,phone,pass));
      }
    }catch(e){sErr(e.message||"Something went wrong. Please try again.");}
    sLoad(false);
  }

  return(
    <div style={{position:"fixed",inset:0,background:"#fff",display:"flex",flexDirection:"column",overflowY:"auto"}}>
      {/* Header */}
      <div style={{background:`linear-gradient(160deg,${C.navyD},${C.navyM})`,padding:"50px 24px 32px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:24}}>
          <div onClick={tapLogo} style={{width:48,height:48,borderRadius:13,background:"linear-gradient(135deg,#1E5EFF,#0A2463)",border:"2px solid rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,fontWeight:900,color:"#fff",cursor:"pointer",userSelect:"none",flexShrink:0}}>B</div>
          <div>
            <div style={{fontWeight:800,fontSize:18,color:"#fff",letterSpacing:1}}>BYPAY BANK</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",letterSpacing:.5}}>{BANK.fdic} · Denver, CO</div>
          </div>
        </div>
        <div style={{fontWeight:800,fontSize:26,color:"#fff",marginBottom:6,lineHeight:1.2}}>
          {tab==="register"?"Open Your Account":tab==="admin"?"Admin Portal":"Welcome Back"}
        </div>
        <div style={{fontSize:14,color:"rgba(255,255,255,0.5)"}}>
          {tab==="register"?"Join thousands banking smarter":tab==="admin"?"Restricted to authorised personnel":"Sign in to your Bypay account"}
        </div>
      </div>

      {/* Tab switcher */}
      <div style={{display:"flex",background:C.bg,padding:4,margin:"0 16px",marginTop:-16,borderRadius:14,gap:3,boxShadow:"0 4px 20px rgba(10,36,99,0.12)",flexShrink:0}}>
        {[{id:"login",l:"Sign In"},{id:"register",l:"Register"}].map(t=>(
          <button key={t.id} onClick={()=>{sTab(t.id);sErr("");}}
            style={{flex:1,padding:"11px 4px",borderRadius:11,border:"none",background:tab===t.id?"#fff":"transparent",color:tab===t.id?C.navy:C.muted,fontWeight:700,cursor:"pointer",fontFamily:"inherit",fontSize:13,transition:"all .2s",boxShadow:tab===t.id?"0 2px 8px rgba(10,36,99,0.1)":undefined}}>
            {t.l}
          </button>
        ))}
      </div>

      {/* Form */}
      <div style={{padding:"24px 20px",flex:1}}>
        {tab==="admin"&&(
          <div style={{background:C.redP,border:`1.5px solid ${C.red}33`,borderRadius:12,padding:"12px 14px",marginBottom:16,display:"flex",gap:10,alignItems:"center"}}>
            <span style={{fontSize:20}}>🔒</span>
            <div><div style={{fontWeight:700,fontSize:13,color:C.red}}>Admin Access Unlocked</div><div style={{fontSize:12,color:C.muted}}>Restricted to authorised staff only.</div></div>
          </div>
        )}
        {tab==="register"&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Input label="First Name" value={firstName} onChange={sFirst} placeholder="Daniel" icon="👤"/>
            <Input label="Last Name" value={lastName} onChange={sLast} placeholder="Wilson"/>
          </div>
        )}
        {tab==="register"&&<Input label="Phone Number" value={phone} onChange={sPhone} placeholder="+1 (303) 555-0100" icon="📱"/>}
        <Input label="Email Address" type="email" value={email} onChange={sEmail} placeholder={tab==="admin"?"admin@bypaybank.com":"you@example.com"} icon="✉️"/>
        <Input label="Password" type="password" value={pass} onChange={sPass} placeholder={tab==="register"?"Min. 6 characters":"••••••••"} icon="🔒"/>

        {err&&<div style={{background:C.redP,borderRadius:12,padding:"12px 14px",marginBottom:16,fontSize:13,color:C.red,fontWeight:600}}>⚠️ {err}</div>}

        <Btn onClick={submit} full loading={loading}>
          {tab==="register"?"Open Free Account →":tab==="admin"?"Admin Sign In →":"Sign In →"}
        </Btn>

        {IS_DEMO&&(
          <div style={{marginTop:20,background:C.bg,borderRadius:12,padding:"14px 16px",fontSize:12,color:C.muted,lineHeight:2}}>
            <div style={{fontWeight:700,color:C.text,marginBottom:4}}>🔴 Demo Mode — Quick Logins:</div>
            <div>👤 sarah@mail.com / 1234 &nbsp;(Verified)</div>
            <div>👤 marcus@mail.com / 1234 &nbsp;(Pending KYC)</div>
            <div>👤 emily@mail.com / 1234 &nbsp;(Verified)</div>
          </div>
        )}

        <div style={{textAlign:"center",marginTop:24,fontSize:12,color:C.muted,lineHeight:2}}>
          📞 {BANK.phone} · ✉️ {BANK.email}<br/>
          <span style={{color:C.blue}}>{BANK.fdic} · {BANK.address}</span>
        </div>
      </div>
    </div>
  );
}

  const[acct,sAcct]=useState(initAccount);
  const[txns,sTxns]=useState([]);
  const[notifs,sNotifs]=useState([]);
  const[loans,sLoans]=useState([]);
  const[goals,sGoals]=useState([]);
  const[benes,sBenes]=useState([]);
  const[card,sCard]=useState(null);
  const[activeTab,sTab]=useState("home");
  const[screen,sScreen]=useState(null);
  const[toast,sToast]=useState(null);
  const[loading,sLoad]=useState(true);
  const t$=(msg,type="success")=>sToast({msg,type});

  useEffect(()=>{
    (async()=>{
      sLoad(true);
      const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000));
      try{
        const[t,n,l,g,b]=await Promise.race([
          Promise.all([DS.getTxns(user.id),DS.getNotifs(user.id),DS.getLoans(user.id),DS.getGoals(user.id),DS.getBenes(user.id)]),
          timeout
        ]);
        sTxns(t);sNotifs(n);sLoans(l);sGoals(g);sBenes(b);
      }catch(e){
        console.warn("Data load failed:",e.message);
        sTxns([]);sNotifs([]);sLoans([]);sGoals([]);sBenes([]);
      }
      sLoad(false);
    })();
  },[user.id]);

  async function doTxn(type,cat,desc,amt){
    const n=parseFloat(amt);
    if(!n||n<=0)return t$("Enter a valid amount","error");
    if(type==="debit"&&n>acct.balance)return t$("Insufficient funds","error");
    try{
      const txn=await DS.addTxn(user.id,type,cat,desc,n);
      sTxns(prev=>[txn,...prev]);
      sAcct(prev=>({...prev,balance:type==="credit"?prev.balance+n:prev.balance-n}));
      const nn=await DS.getNotifs(user.id);sNotifs(nn);
      return txn;
    }catch(e){t$("Transaction failed: "+e.message,"error");return null;}
  }

  const unread=(notifs||[]).filter(n=>n.read_status===0).length;
  const kycPct=user.profile_complete||0;

  const TABS=[
    {id:"home",icon:<HomeIcon/>,label:"Home"},
    {id:"pay",icon:<PayIcon/>,label:"Pay"},
    {id:"cards",icon:<CardIcon/>,label:"Cards"},
    {id:"more",icon:<MoreIcon/>,label:"More"},
    {id:"profile",icon:<ProfileIcon/>,label:"Account"},
  ];

  if(loading)return(
    <div style={{position:"fixed",inset:0,background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:24}}>
      <Spin size={36}/>
      <div style={{fontSize:14,color:C.muted,textAlign:"center"}}>Loading your account…</div>
      {IS_LOCAL&&<div style={{background:"#FFF8E1",border:`1.5px solid ${C.gold}`,borderRadius:14,padding:"14px 18px",maxWidth:340,fontSize:12,color:"#7a5800",lineHeight:1.8,textAlign:"center"}}>⚠️ <strong>Opened from local file.</strong> Upload to GitHub Pages for Firebase to work properly.</div>}
    </div>
  );

  return(
    <div style={{position:"fixed",inset:0,display:"flex",flexDirection:"column",background:C.bg}}>
      {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>sToast(null)}/>}

      {screen&&React.cloneElement(screen,{user,acct,sAcct,txns,sTxns,notifs,sNotifs,loans,sLoans,goals,sGoals,benes,sBenes,card,sCard,doTxn,t$,DS,sUser,onBack:()=>sScreen(null),push:s=>sScreen(s)})}

      {!screen&&<>
        <div style={{paddingTop:"env(safe-area-inset-top)",background:C.navy,flexShrink:0}}/>
        <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column"}}>
          {activeTab==="home"&&<HomeTab user={user} acct={acct} txns={txns} notifs={notifs} sNotifs={sNotifs} unread={unread} goals={goals} kycPct={kycPct} push={sScreen} t$={t$} onLogout={async()=>{await DS.logout();onLogout();}}/>}
          {activeTab==="pay"&&<PayTab user={user} acct={acct} sAcct={sAcct} txns={txns} sTxns={sTxns} sNotifs={sNotifs} doTxn={doTxn} benes={benes} sBenes={sBenes} t$={t$} push={sScreen}/>}
          {activeTab==="cards"&&<CardsTab user={user} acct={acct} card={card} sCard={sCard} t$={t$}/>}
          {activeTab==="more"&&<MoreTab user={user} acct={acct} sAcct={sAcct} txns={txns} sTxns={sTxns} loans={loans} sLoans={sLoans} goals={goals} sGoals={sGoals} doTxn={doTxn} t$={t$} push={sScreen}/>}
          {activeTab==="profile"&&<ProfileTab user={user} sUser={sUser} acct={acct} notifs={notifs} sNotifs={sNotifs} t$={t$} onLogout={async()=>{await DS.logout();onLogout();}} push={sScreen}/>}
        </div>
        <div style={{background:C.tabBg,borderTop:`1px solid ${C.border}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom)",flexShrink:0,boxShadow:"0 -4px 20px rgba(10,36,99,0.07)"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>sTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 4px 8px",background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",position:"relative"}}>
              <div style={{color:activeTab===t.id?C.navy:C.muted,transform:activeTab===t.id?"scale(1.1)":"scale(1)",transition:"all .2s"}}>{t.icon}</div>
              <div style={{fontSize:10,fontWeight:activeTab===t.id?700:500,color:activeTab===t.id?C.navy:C.muted}}>{t.label}</div>
              {t.id==="profile"&&unread>0&&<div style={{position:"absolute",top:8,right:"50%",marginRight:-18,width:8,height:8,background:C.red,borderRadius:"50%"}}/>}
              {activeTab===t.id&&<div style={{position:"absolute",bottom:0,width:20,height:3,background:C.navy,borderRadius:"3px 3px 0 0"}}/>}
            </button>
          ))}
        </div>
      </>}
    </div>
  );
}

function HomeTab({user,acct,txns,notifs,sNotifs,unread,goals,kycPct,push,t$,onLogout}){

          </div>
          <div style={{display:"flex",gap:10}}>
            <IBtn icon={hidden?"👁":"🙈"} onClick={()=>sH(!hidden)}/>
            <div style={{position:"relative"}}>

            </div>
          </div>
        </div>
        <div style={{marginBottom:6}}>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:4,letterSpacing:.5}}>CHECKING BALANCE</div>
          <div style={{fontFamily:"serif",fontSize:40,fontWeight:700,color:"#fff",letterSpacing:1}}>{hidden?"$ ●●●●●":fmt(acct.balance)}</div>
        </div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:18}}>Acct: ●●●● {user.account_number?.slice(-4)} · Routing: {user.routing_number}</div>
        <div style={{display:"flex",gap:10}}>
          {[[fmtS(acct.savings),"Savings","🐖"],[fmtS(acct.loan_balance),"Loans","🏛"],[user.kyc_status==="verified"?"Verified":"Pending","KYC","🪪"]].map(([v,l,i])=>(

      <div style={{flex:1,overflowY:"auto",background:C.bg}}>
        <div style={{padding:"0 16px"}}>

              <span style={{fontSize:22}}>📋</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13,color:"#7a5800"}}>Complete Your Profile</div>
                <div style={{fontSize:12,color:"#a07000",marginTop:2}}>Profile {kycPct}% complete — Finish to unlock all features</div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16}}>
              {[
                {icon:"↔️",label:"Send Money",s:<TransferScreen/>},
                {icon:"🧾",label:"Pay Bills",s:<BillsScreen/>},

                {icon:"🏛️",label:"Loans",s:<LoansScreen/>},

            </Card>
          </div>

          {/* FDIC Banner */}

            <div style={{display:"flex",gap:14,alignItems:"center"}}>
              <div style={{fontSize:36}}>🏦</div>
              <div>
                <div style={{fontWeight:700,fontSize:14,color:"#fff"}}>FDIC Insured Up to $250,000</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginTop:2}}>{BANK.name} · {BANK.address}</div>
              </div>
            </div>
          </Card>
        </div>
      </div>

      {showN&&(
        <Sheet title="Notifications" onClose={()=>sSN(false)}>
          {notifs.length===0&&<div style={{textAlign:"center",padding:"30px 0",color:C.muted}}>No notifications</div>}
          {(notifs||[]).map(n=>(
            <div key={n.id} style={{display:"flex",gap:12,padding:"12px 0",borderBottom:`1px solid ${C.border}`,opacity:n.read_status?0.6:1,cursor:"pointer"}}
              onClick={async()=>{await DS.markNotifRead(n.id);if(sNotifs)sNotifs(prev=>prev.map(x=>x.id===n.id?{...x,read_status:1}:x));}}>
              <div style={{width:8,height:8,borderRadius:4,background:n.read_status?C.border:C.red,marginTop:5,flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:n.read_status?400:600,lineHeight:1.5}}>{n.message}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:2}}>{n.created_at?.slice(0,16)}</div>
              </div>
            </div>
          ))}
        </Sheet>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   KYC / PASSPORT PROFILE SCREEN
══════════════════════════════════════════════════════ */
function KYCScreen({user,sUser,t$,onBack}){
  const[tab,sTab]=useState("personal");
  const[form,sForm]=useState({
    first_name:user?.first_name||"",
    last_name:user?.last_name||"",
    dob:user?.dob||"",
    phone:user?.phone||"",
    email:user?.email||"",
    address:user?.address||"",
    city:user?.city||"",
    state:user?.state||"CO",
    zip:user?.zip||"",
    ssn_last4:user?.ssn_last4||"",
    id_type:user?.id_type||"Passport",
    id_number:user?.id_number||"",
    id_expiry:user?.id_expiry||"",
    employment:user?.employment||"Employed",
    employer:user?.employer||"",
    annual_income:user?.annual_income||"",
    tax_id:user?.tax_id||"",
  });
  const[saving,sSaving]=useState(false);

  function update(k,v){sForm(f=>({...f,[k]:v}));}

  function calcPct(f){
    const fields=["first_name","last_name","dob","phone","address","city","state","zip","ssn_last4","id_type","id_number","employment","annual_income"];
    const filled=fields.filter(k=>f[k]&&String(f[k]).trim()).length;
    return Math.round((filled/fields.length)*100);
  }

  async function save(){
    sSaving(true);
    const pct=calcPct(form);
    const kyc_status=pct===100?"verified":"pending";
    const patch={...form,full_name:`${form.first_name} ${form.last_name}`,profile_complete:pct,kyc_status};
    await DS.updateUser(user.id,patch);
    sUser(prev=>({...prev,...patch}));
    sSaving(false);
    t$(pct===100?"Profile verified! All features unlocked 🎉":"Profile saved! Complete remaining fields to verify.","success");
    onBack();
  }

  const pct=calcPct(form);
  const tabs=[{id:"personal",label:"Personal"},{id:"address",label:"Address"},{id:"identity",label:"ID & Passport"},{id:"financial",label:"Financial"}];

  return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title="My Profile & KYC" left={<IBtn icon="←" onClick={onBack}/>}/>
        {/* Progress bar */}
        <div style={{padding:"10px 20px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"rgba(255,255,255,0.6)",marginBottom:6}}>
            <span>Profile Completion</span><span style={{fontWeight:700,color:"#fff"}}>{pct}%</span>
          </div>
          <div style={{height:6,background:"rgba(255,255,255,0.15)",borderRadius:4}}>
            <div style={{height:"100%",borderRadius:4,background:pct===100?C.green:C.blue,width:`${pct}%`,transition:"width .5s"}}/>
          </div>
          {pct===100&&<div style={{fontSize:11,color:"rgba(255,255,255,0.6)",marginTop:4}}>✓ All required fields complete — KYC Verified</div>}
        </div>
      </div>

      {/* Section tabs */}
      <div style={{display:"flex",gap:3,padding:"10px 14px",background:"#fff",borderBottom:`1px solid ${C.border}`,overflowX:"auto",flexShrink:0}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>sTab(t.id)}
            style={{whiteSpace:"nowrap",padding:"8px 14px",borderRadius:20,border:`1.5px solid ${tab===t.id?C.blue:C.border}`,background:tab===t.id?C.blueP:"transparent",color:tab===t.id?C.blue:C.muted,fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{flex:1,overflowY:"auto",padding:16}}>

        {/* PERSONAL INFO */}
        {tab==="personal"&&(
          <Card>
            {/* Profile avatar */}
            <div style={{textAlign:"center",marginBottom:20,padding:"16px 0",background:C.blueP,borderRadius:14}}>
              <div style={{width:72,height:72,borderRadius:22,background:`linear-gradient(135deg,${C.blue},${C.navy})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,fontWeight:800,color:"#fff",margin:"0 auto 10px"}}>
                {(form.first_name[0]||"?")+""+(form.last_name[0]||"")}
              </div>
              <div style={{fontWeight:700,fontSize:16}}>{form.first_name} {form.last_name}</div>
              <div style={{fontSize:12,color:C.muted,marginTop:3}}>{user?.email}</div>
              <div style={{marginTop:8}}><KYCBadge status={pct===100?"verified":"pending"} pct={pct}/></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Input label="First Name *" value={form.first_name} onChange={v=>update("first_name",v)} placeholder="Daniel" icon="👤"/>
              <Input label="Last Name *" value={form.last_name} onChange={v=>update("last_name",v)} placeholder="Wilson"/>
            </div>
            <Input label="Date of Birth *" type="date" value={form.dob} onChange={v=>update("dob",v)} icon="🎂" note={form.dob?`Age: ${age(form.dob)} years old`:"Required — Must be 18+"}/>

/* ══════════════════════════════════════════════════════
   TRANSFER SCREEN  (Zelle / ACH)
══════════════════════════════════════════════════════ */
function TransferScreen({user,acct,doTxn,benes,sBenes,t$,onBack,type="zelle"}){
  const[step,sStep]=useState(1);
  const[method,sMethod]=useState(type);
  const[acctNo,sAcctNo]=useState("");
  const[routing,sRouting]=useState(BANK.routing);
  const[bankName,sBankName]=useState("Bypay Bank");
  const[resolved,sResolved]=useState(null);
  const[looking,sLooking]=useState(false);
  const[amt,sAmt]=useState("");
  const[memo,sMemo]=useState("");
  const[pin,sPin]=useState("");
  const[saveBene,sSaveBene]=useState(false);
  const[sent,sSent]=useState(null);

  async function lookup(){
    if(acctNo.length<10)return t$("Enter 10-digit account number","error");
    sLooking(true);
    const r=await DS.lookupAcct(acctNo);
    sLooking(false);
    if(r.found)sResolved(r);
    else{sResolved({found:false});t$("Account not found","error");}
  }

  async function confirm(){
    if(pin!=="1234")return t$("Incorrect PIN. Demo PIN: 1234","error");
    const n=parseFloat(amt);
    const cat=method==="zelle"?"zelle_out":"transfer_out";
    const desc=`${method==="zelle"?"Zelle® to":"ACH to"} ${resolved?.name}${memo?` — ${memo}`:""}`;
    const ok=await doTxn("debit",cat,desc,amt);
    if(ok){
      if(resolved?.user_id)await DS.addTxn(resolved.user_id,"credit",method==="zelle"?"zelle_in":"transfer_in",`${method==="zelle"?"Zelle® from":"ACH from"} ${user.full_name}`,n);
      if(saveBene&&!(benes||[]).find(b=>b.account_number===acctNo)){
        const nb={id:uid(),user_id:user.id,name:resolved.name,account_number:acctNo,routing,bank_name:bankName,type:method,is_favourite:0,created_at:today()};
        await DS.addBene(nb);sBenes(prev=>[nb,...prev]);
      }
      sSent({name:resolved.name,amount:n,method});sStep(4);
    }
  }

  if(step===4&&sent)return(
    <FullModal>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32}}>
        <div style={{width:90,height:90,borderRadius:45,background:C.greenP,display:"flex",alignItems:"center",justifyContent:"center",fontSize:44,marginBottom:24,animation:"popIn .5s ease"}}>✓</div>
        <div style={{fontFamily:"serif",fontSize:28,fontWeight:700,color:C.green,marginBottom:8}}>Transfer Sent!</div>
        <div style={{fontSize:15,color:C.muted,textAlign:"center",lineHeight:1.8,marginBottom:8}}>{fmt(sent.amount)} {sent.method==="zelle"?"sent via Zelle®":"transferred via ACH"} to<br/><strong style={{color:C.text}}>{sent.name}</strong></div>
        <div style={{fontSize:12,color:C.muted,marginBottom:40}}>{sent.method==="zelle"?"Delivered instantly":"Arrives in 1–3 business days"}</div>
        <Btn onClick={onBack} full>Done</Btn>
      </div>
    </FullModal>
  );

  return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title={step===1?"Select Recipient":step===2?"Enter Amount":"Confirm Transfer"} left={<IBtn icon="←" onClick={step>1?()=>sStep(step-1):onBack}/>}/>
        <div style={{display:"flex",gap:3,padding:"10px 20px 14px"}}>
          {[1,2,3].map(s=><div key={s} style={{flex:1,height:3,borderRadius:2,background:step>=s?"rgba(255,255,255,0.9)":"rgba(255,255,255,0.2)"}}/>)}
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:20}}>
        {step===1&&(
          <>
            <div style={{display:"flex",gap:8,marginBottom:18}}>
              {["zelle","ach"].map(m=>(
                <button key={m} onClick={()=>sMethod(m)} style={{flex:1,padding:"12px 8px",borderRadius:14,border:`2px solid ${method===m?C.blue:C.border}`,background:method===m?C.blueP:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",color:method===m?C.blue:C.muted}}>
                  {m==="zelle"?"⚡ Zelle® (Instant)":"🏦 ACH Wire (1-3 days)"}
                </button>
              ))}
            </div>
            {(benes||[]).length>0&&(
              <div style={{marginBottom:20}}>
                <div style={{fontSize:12,fontWeight:600,color:C.muted,marginBottom:10,letterSpacing:.5}}>SAVED RECIPIENTS</div>
                {(benes||[]).map(b=>(
                  <Card key={b.id} style={{marginBottom:10,padding:14,display:"flex",alignItems:"center",gap:14}} onClick={()=>{sAcctNo(b.account_number);sRouting(b.routing||BANK.routing);sBankName(b.bank_name);sResolved({found:true,name:b.name});}} press>
                    <div style={{width:46,height:46,borderRadius:14,background:C.blueP,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800,color:C.blue,flexShrink:0}}>{b.name[0]}</div>
                    <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{b.name}</div><div style={{fontSize:12,color:C.muted}}>{b.bank_name} · {b.account_number}</div></div>
                    {resolved?.name===b.name&&<div style={{width:22,height:22,borderRadius:11,background:C.green,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:13,fontWeight:700}}>✓</div>}
                  </Card>
                ))}
              </div>
            )}
            <div style={{fontSize:12,fontWeight:600,color:C.muted,marginBottom:10,letterSpacing:.5}}>NEW RECIPIENT</div>
            <Input label="Bank Name" value={bankName} onChange={sBankName} placeholder="Chase, Wells Fargo…" icon="🏦"/>
            <div style={{display:"flex",gap:10}}>
              <div style={{flex:1}}><Input label="Account Number" value={acctNo} onChange={v=>{sAcctNo(v);sResolved(null);}} placeholder="10-digit number" keyboardType="number" maxLength={10}/></div>
              <button onClick={lookup} style={{marginTop:22,padding:"15px 14px",background:C.navy,color:"#fff",border:"none",borderRadius:12,fontWeight:700,cursor:"pointer",fontSize:13,height:52,flexShrink:0,fontFamily:"inherit"}}>
                {looking?<Spin size={16} color="#fff"/>:"Verify"}
              </button>
            </div>
            {method==="ach"&&<Input label="Routing Number" value={routing} onChange={sRouting} placeholder="9-digit routing" keyboardType="number" maxLength={9} icon="🔢"/>}
            {resolved&&<div style={{borderRadius:12,padding:"12px 14px",marginBottom:14,fontWeight:600,fontSize:14,background:resolved.found?C.greenP:C.redP,color:resolved.found?C.green:C.red}}>{resolved.found?"✓ "+resolved.name:"✕ Account not found"}</div>}
            <label style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,cursor:"pointer"}}>
              <input type="checkbox" checked={saveBene} onChange={e=>sSaveBene(e.target.checked)} style={{width:18,height:18,accentColor:C.blue}}/>
              <span style={{fontSize:14,color:C.muted}}>Save to recipients</span>
            </label>
            <Btn onClick={()=>sStep(2)} full disabled={!resolved?.found}>Continue →</Btn>
          </>
        )}
        {step===2&&(
          <>
            <Card style={{marginBottom:20,padding:16,background:C.blueP}}>
              <div style={{fontSize:12,color:C.muted}}>Sending to</div>
              <div style={{fontWeight:700,fontSize:16,marginTop:2}}>{resolved?.name}</div>
              <div style={{fontSize:12,color:C.muted,marginTop:2}}>{acctNo} · {bankName}</div>
              <div style={{fontSize:11,color:C.blue,marginTop:4,fontWeight:600}}>{method==="zelle"?"⚡ Instant via Zelle®":"🏦 ACH — 1-3 Business Days"}</div>
            </Card>
            <Card style={{marginBottom:20}}>
              <div style={{fontFamily:"serif",fontSize:40,fontWeight:700,textAlign:"center",marginBottom:4,minHeight:52,color:C.text}}>{amt?fmt(parseFloat(amt)||0):"$0.00"}</div>
              <div style={{borderTop:`1px solid ${C.border}`,paddingTop:14}}><AmountKey value={amt} onChange={sAmt}/></div>
            </Card>
            <Input label="Memo (optional)" value={memo} onChange={sMemo} placeholder="e.g. Rent for May" icon="📝"/>
            <Btn onClick={()=>{const n=parseFloat(amt);if(!n||n<=0)return t$("Enter amount","error");if(n>acct.balance)return t$("Insufficient funds","error");sStep(3);}} full>Continue →</Btn>
          </>
        )}
        {step===3&&(
          <>
            <Card style={{marginBottom:28,padding:22}}>
              <div style={{textAlign:"center",marginBottom:16}}>
                <div style={{fontSize:13,color:C.muted}}>You're sending</div>
                <div style={{fontFamily:"serif",fontSize:36,fontWeight:700,color:C.navy,marginBottom:4}}>{fmt(parseFloat(amt))}</div>
                <div style={{fontSize:14,color:C.muted}}>to <strong style={{color:C.text}}>{resolved?.name}</strong></div>
              </div>
              {[["Recipient",resolved?.name],["Account",acctNo],["Bank",bankName],["Method",method==="zelle"?"Zelle® (Instant)":"ACH Wire (1-3 days)"],["Amount",fmt(parseFloat(amt))],["Fee","$0.00 — Free"],["Memo",memo||"—"]].map(([k,v])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
                  <span style={{color:C.muted}}>{k}</span><span style={{fontWeight:600}}>{v}</span>
                </div>
              ))}
            </Card>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontWeight:600,fontSize:15,marginBottom:4}}>Enter Your PIN</div>
              <div style={{fontSize:12,color:C.muted}}>Demo PIN: 1234</div>
            </div>
            <PinPad value={pin} onChange={sPin}/>
            <div style={{height:24}}/>
            <Btn onClick={confirm} full disabled={pin.length<4}>Confirm & Send {fmt(parseFloat(amt)||0)}</Btn>
          </>
        )}
      </div>
    </FullModal>
  );
}

/* ══════════════════════════════════════════════════════
   BILLS SCREEN
══════════════════════════════════════════════════════ */
function BillsScreen({user,acct,doTxn,t$,onBack}){
  const[sel,sSel]=useState(null);
  const[acctNo,sAN]=useState("");
  const[amt,sAmt]=useState("");
  const BILLS=[
    {id:"electric",icon:"⚡",name:"Electric",sub:"Xcel Energy, PSCo…",color:"#F59E0B"},
    {id:"gas",icon:"🔥",name:"Natural Gas",sub:"Atmos, Nicor…",color:C.orange},
    {id:"water",icon:"💧",name:"Water",sub:"Denver Water, etc.",color:C.blue},
    {id:"internet",icon:"🌐",name:"Internet",sub:"Comcast, Century…",color:"#8B5CF6"},
    {id:"phone",icon:"📱",name:"Phone Bill",sub:"AT&T, Verizon, T-Mobile",color:C.navy},
    {id:"insurance",icon:"🛡",name:"Insurance",sub:"Health, Auto, Home",color:C.green},
    {id:"mortgage",icon:"🏠",name:"Mortgage/Rent",sub:"Monthly payment",color:"#EF4444"},
    {id:"credit_card",icon:"💳",name:"Credit Card",sub:"Visa, Mastercard…",color:"#6B7280"},
    {id:"streaming",icon:"📺",name:"Streaming",sub:"Netflix, Hulu, etc.",color:"#DC2626"},
    {id:"auto",icon:"🚗",name:"Auto Loan",sub:"Car payment",color:"#059669"},
    {id:"student",icon:"🎓",name:"Student Loan",sub:"Federal, private",color:"#7C3AED"},
    {id:"other",icon:"📋",name:"Other Bill",sub:"Any other payment",color:C.muted},
  ];
  async function pay(){
    const b=BILLS.find(b=>b.id===sel);
    const n=parseFloat(amt);
    if(!n||n<=0)return t$("Enter amount","error");
    if(!acctNo)return t$("Enter account/reference number","error");
    if(n>acct.balance)return t$("Insufficient funds","error");
    const ok=await doTxn("debit","bill_payment",`${b.name} — Acct #${acctNo}`,amt);
    if(ok){t$(`${b.name} bill paid!`);sSel(null);sAN("");sAmt("");onBack();}
  }
  if(sel){
    const b=BILLS.find(b=>b.id===sel);
    return(
      <FullModal>
        <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
          <AppBar title={`Pay ${b.name}`} left={<IBtn icon="←" onClick={()=>sSel(null)}/>}/>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:20}}>
          <Card style={{display:"flex",gap:14,alignItems:"center",marginBottom:20,padding:16}}>
            <div style={{width:52,height:52,borderRadius:14,background:b.color+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>{b.icon}</div>
            <div><div style={{fontWeight:700,fontSize:16}}>{b.name}</div><div style={{fontSize:12,color:C.muted}}>{b.sub}</div></div>
          </Card>
          <Input label="Account / Reference Number" value={acctNo} onChange={sAN} placeholder="Enter bill account number" icon="🔢"/>
          <Card style={{marginBottom:20}}>
            <div style={{fontFamily:"serif",fontSize:36,fontWeight:700,textAlign:"center",marginBottom:4,minHeight:48,color:C.text}}>{amt?fmt(parseFloat(amt)||0):"$0.00"}</div>
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:14}}><AmountKey value={amt} onChange={sAmt}/></div>
          </Card>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:20}}>
            {[50,100,150,200,500].map(v=><button key={v} onClick={()=>sAmt(String(v))} style={{flex:"1 1 60px",padding:"9px 4px",borderRadius:10,border:`1.5px solid ${Number(amt)===v?b.color:C.border}`,background:Number(amt)===v?b.color+"18":"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",color:Number(amt)===v?b.color:C.text}}>${v}</button>)}
          </div>
          <Btn onClick={pay} full color={b.color}>Pay {b.name} Bill ✓</Btn>
        </div>
      </FullModal>
    );
  }
  return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title="Pay Bills" left={<IBtn icon="←" onClick={onBack}/>}/>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:16}}>

   LOANS SCREEN
══════════════════════════════════════════════════════ */
function LoansScreen({user,acct,sAcct,loans,sLoans,doTxn,t$,onBack}){
  const[tab,sTab]=useState("active");
  const[amt,sAmt]=useState("");
  const[purpose,sPurpose]=useState("Personal");
  const[term,sTerm]=useState("24");
  const active=loans?.filter(l=>l.status==="active")||[];
  const paid=loans?.filter(l=>l.status==="paid")||[];
  const rate=8.99;
  const monthly=amt?((parseFloat(amt)*rate/100/12)/(1-Math.pow(1+rate/100/12,-parseInt(term)))).toFixed(2):0;

  async function apply(){
    const n=parseFloat(amt);
    if(!n||n<1000)return t$("Minimum loan $1,000","error");
    if(n>50000)return t$("Maximum loan $50,000","error");
    if(user?.kyc_status!=="verified")return t$("Complete identity verification first","error");
    const loan={id:uid(),user_id:user.id,amount:n,outstanding:n,monthly_payment:parseFloat(monthly),interest_rate:rate,tenure_months:parseInt(term),purpose,status:"active",disbursed_at:today()};
    await DS.addLoan(loan);
    const ok=await doTxn("credit","loan_disbursement",`Personal Loan Disbursed — ${purpose}`,n);
    if(ok){sLoans(prev=>[loan,...(prev||[])]);sAcct(prev=>({...prev,loan_balance:prev.loan_balance+n}));sAmt("");t$(`Loan of ${fmt(n)} approved!`);}
  }

  async function repay(loan){
    if(loan.monthly_payment>acct.balance)return t$("Insufficient funds","error");
    const nb=Math.max(0,loan.outstanding-loan.monthly_payment);
    await DS.updateLoan(loan.id,{outstanding:nb,status:nb<=0?"paid":"active"});
    const ok=await doTxn("debit","loan_repayment",`Loan Payment — ${loan.purpose}`,loan.monthly_payment);
    if(ok){sLoans(prev=>prev.map(l=>l.id===loan.id?{...l,outstanding:nb,status:nb<=0?"paid":"active"}:l));sAcct(prev=>({...prev,loan_balance:Math.max(0,prev.loan_balance-loan.monthly_payment)}));}
  }

  return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title="Personal Loans" left={<IBtn icon="←" onClick={onBack}/>}/>
        <div style={{display:"flex",gap:4,padding:"8px 16px 14px"}}>
          {["active","apply"].map(t=><button key={t} onClick={()=>sTab(t)} style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:tab===t?"rgba(255,255,255,0.15)":"transparent",color:tab===t?"#fff":"rgba(255,255,255,0.5)",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{t==="active"?"My Loans":"Apply Now"}</button>)}
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:16}}>
        {tab==="active"&&(
          <>
            {active.length===0&&(
              <Card style={{textAlign:"center",padding:40}}>
                <div style={{fontSize:48,marginBottom:14}}>🏛️</div>
                <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>No Active Loans</div>
                <div style={{fontSize:13,color:C.muted,marginBottom:20}}>Apply for a personal loan up to $50,000 at {rate}% APR</div>
                <Btn onClick={()=>sTab("apply")} color={C.orange} sm>Apply Now →</Btn>
              </Card>
            )}
            {active.map(loan=>(
              <Card key={loan.id} style={{marginBottom:14,borderLeft:`4px solid ${C.orange}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
                  <div><div style={{fontWeight:700,fontSize:15}}>{loan.purpose} Loan</div><div style={{fontSize:12,color:C.muted}}>Since {loan.disbursed_at}</div></div>
                  <div style={{background:C.goldP,color:C.orange,fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:10}}>ACTIVE</div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
                  {[["Original",fmt(loan.amount)],["Remaining",fmt(loan.outstanding)],["Monthly",fmt(loan.monthly_payment)]].map(([l,v])=>(
                    <div key={l} style={{background:C.bg,borderRadius:10,padding:"10px 8px",textAlign:"center"}}>
                      <div style={{fontSize:10,color:C.muted,marginBottom:3}}>{l}</div>
                      <div style={{fontWeight:700,fontSize:12}}>{v}</div>
                    </div>
                  ))}
                </div>
                <div style={{marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.muted,marginBottom:4}}>
                    <span>Repaid</span><span>{Math.round(((loan.amount-loan.outstanding)/loan.amount)*100)}%</span>
                  </div>
                  <div style={{height:8,background:C.border,borderRadius:8}}><div style={{height:"100%",borderRadius:8,background:C.orange,width:`${((loan.amount-loan.outstanding)/loan.amount)*100}%`}}/></div>
                </div>
                <Btn onClick={()=>repay(loan)} full color={C.orange} sm>Make Payment {fmt(loan.monthly_payment)}</Btn>
              </Card>
            ))}
            {paid.map(l=><Card key={l.id} style={{marginBottom:10,opacity:.65,display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontWeight:600}}>{l.purpose} — {fmt(l.amount)}</div><div style={{fontSize:11,color:C.muted}}>{l.disbursed_at}</div></div><div style={{background:C.greenP,color:C.green,fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:10}}>PAID OFF</div></Card>)}
          </>
        )}
        {tab==="apply"&&(
          <>
            {user?.kyc_status!=="verified"&&<Card style={{background:C.redP,border:`1px solid ${C.red}33`,marginBottom:16}}><div style={{fontWeight:700,fontSize:13,color:C.red,marginBottom:4}}>⚠️ Identity Verification Required</div><div style={{fontSize:12,color:C.muted}}>Complete your profile and KYC to apply for loans.</div></Card>}
            <Card style={{marginBottom:16}}>
              <Input label="Loan Amount ($1,000 – $50,000)" value={amt} onChange={sAmt} placeholder="e.g. 10000" keyboardType="number" icon="$"/>
              <Picker label="Loan Purpose" value={purpose} onChange={sPurpose} options={["Personal","Debt Consolidation","Home Improvement","Medical","Education","Auto","Travel","Business","Wedding","Other"]}/>
              <Picker label="Loan Term" value={term} onChange={sTerm} options={[{value:"12",label:"12 months (1 year)"},{value:"24",label:"24 months (2 years)"},{value:"36",label:"36 months (3 years)"},{value:"48",label:"48 months (4 years)"},{value:"60",label:"60 months (5 years)"}]}/>
              {parseFloat(amt)>=1000&&(
                <div style={{background:C.blueP,borderRadius:12,padding:"14px 16px",marginBottom:14}}>
                  <div style={{fontWeight:700,fontSize:14,marginBottom:10,color:C.navy}}>Loan Summary</div>
                  {[["Loan Amount",fmt(parseFloat(amt))],["APR",`${rate}% fixed`],["Term",`${term} months`],["Monthly Payment",`$${monthly}`],["Total Repayable",`$${(parseFloat(monthly)*parseInt(term)).toFixed(2)}`]].map(([k,v])=>(
                    <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}>
                      <span style={{color:C.muted}}>{k}</span><span style={{fontWeight:700}}>{v}</span>
                    </div>
                  ))}
                </div>
              )}
              <Btn onClick={apply} full disabled={user?.kyc_status!=="verified"} color={C.orange}>Apply for Loan 🏛️</Btn>
            </Card>
            <div style={{fontSize:11,color:C.muted,textAlign:"center",lineHeight:1.9}}>Subject to credit approval. Rates may vary.<br/>{BANK.fdic} · NMLS #123456</div>
          </>
        )}
      </div>
    </FullModal>
  );
}

/* ══════════════════════════════════════════════════════
   SAVINGS SCREEN
══════════════════════════════════════════════════════ */
function SavingsScreen({user,acct,sAcct,goals,sGoals,doTxn,t$,onBack}){
  const[tab,sTab]=useState("goals");
  const[selGoal,sSel]=useState(null);
  const[dep,sDep]=useState("");
  const[gName,sGN]=useState("");
  const[gTarget,sGT]=useState("");

  async function save(goal){
    const n=parseFloat(dep);
    if(!n||n<=0)return t$("Enter amount","error");
    if(n>acct.balance)return t$("Insufficient funds","error");
    const ns=Math.min(goal.saved+n,goal.target);
    await DS.updateGoal(goal.id,{saved:ns,status:ns>=goal.target?"completed":"active"});
    const ok=await doTxn("debit","savings_deposit",`Savings Deposit — ${goal.name}`,n);
    if(ok){sGoals(prev=>prev.map(g=>g.id===goal.id?{...g,saved:ns}:g));sAcct(prev=>({...prev,savings:prev.savings+n}));sDep("");sSel(null);t$(`${fmt(n)} saved to "${goal.name}"!`);}
  }

  async function create(){
    const n=parseFloat(gTarget);
    if(!gName||!n||n<100)return t$("Minimum target $100","error");
    const g={id:uid(),user_id:user.id,name:gName,target:n,saved:0,status:"active",created_at:today()};
    await DS.addGoal(g);sGoals(prev=>[g,...(prev||[])]);sGN("");sGT("");t$(`Goal "${gName}" created!`);sTab("goals");
  }

  return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title="Savings" left={<IBtn icon="←" onClick={onBack}/>}/>

        </Sheet>
      )}
    </FullModal>
  );
}

/* ══════════════════════════════════════════════════════
   HISTORY SCREEN
══════════════════════════════════════════════════════ */
function HistoryScreen({user,txns,push,onBack}){
  const[filter,sF]=useState("all");
  const[q,sQ]=useState("");
  const filtered=useMemo(()=>(txns||[]).filter(t=>(filter==="all"||t.type===filter)&&(t.description?.toLowerCase().includes(q.toLowerCase())||t.reference?.toLowerCase().includes(q.toLowerCase()))),[txns,filter,q]);
  const totalIn=filtered.filter(t=>t.type==="credit").reduce((s,t)=>s+t.amount,0);
  const totalOut=filtered.filter(t=>t.type==="debit").reduce((s,t)=>s+t.amount,0);
  return(
    <FullModal>
      <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
        <AppBar title="Transaction History" left={<IBtn icon="←" onClick={onBack}/>}/>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:16}}>
        <div style={{background:"#fff",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,marginBottom:14,border:`1px solid ${C.border}`}}>
          <span style={{fontSize:18}}>🔍</span>
          <input value={q} onChange={e=>sQ(e.target.value)} placeholder="Search transactions…" style={{flex:1,border:"none",outline:"none",fontSize:15,fontFamily:"inherit",background:"transparent",color:C.text}}/>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {["all","credit","debit"].map(f=><button key={f} onClick={()=>sF(f)} style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:filter===f?C.navy:"#fff",color:filter===f?"#fff":C.muted,fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit",textTransform:"capitalize"}}>{f}</button>)}
        </div>
        {filtered.length>0&&(
          <div style={{display:"flex",gap:10,marginBottom:14}}>
            <Card style={{flex:1,textAlign:"center",padding:14,background:C.greenP}}>
              <div style={{fontSize:11,color:C.muted}}>Money In</div>
              <div style={{fontWeight:700,color:C.green,fontSize:15,marginTop:2}}>+{fmt(totalIn)}</div>
            </Card>
            <Card style={{flex:1,textAlign:"center",padding:14,background:C.redP}}>
              <div style={{fontSize:11,color:C.muted}}>Money Out</div>
              <div style={{fontWeight:700,color:C.red,fontSize:15,marginTop:2}}>-{fmt(totalOut)}</div>
            </Card>
          </div>
        )}
        <Card>
          {filtered.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:C.muted}}>No transactions found</div>}
          {filtered.map(t=><TxnItem key={t.id} t={t} onPress={()=>push(<TxnDetailScreen txn={t}/>)}/>)}
        </Card>
      </div>
    </FullModal>
  );
}

/* ══════════════════════════════════════════════════════
   ADMIN APP
══════════════════════════════════════════════════════ */
function AdminApp({admin,onLogout}){
  const[users,sUsers]=useState([]);
  const[accounts,sAccounts]=useState([]);
  const[txns,sTxns]=useState([]);
  const[notifs,sNotifs]=useState([]);
  const[loans,sLoans]=useState([]);
  const[loading,sLoad]=useState(true);
  const[activeTab,sTab]=useState("dashboard");
  const[toast,sToast]=useState(null);
  const[screen,sScreen]=useState(null);
  const t$=(msg,type="success")=>sToast({msg,type});

  useEffect(()=>{
    (async()=>{
      sLoad(true);
      const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000));
      try{
        const[u,a,t,n,l]=await Promise.race([Promise.all([DS.getAllUsers(),DS.getAllAccounts(),DS.getAllTxns(),DS.getAllNotifs(),DS.getAllLoans()]),timeout]);
        sUsers(u);sAccounts(a);sTxns(t);sNotifs(n);sLoans(l);
      }catch(e){sUsers([]);sAccounts([]);sTxns([]);sNotifs([]);sLoans([]);}
      sLoad(false);
    })();
  },[]);

  const userMap=useMemo(()=>Object.fromEntries(users.map(u=>[u.id,u])),[users]);
  const acctMap=useMemo(()=>Object.fromEntries(accounts.map(a=>[a.user_id,a])),[accounts]);
  const totalBal=accounts.reduce((s,a)=>s+a.balance,0);
  const totalSav=accounts.reduce((s,a)=>s+a.savings,0);
  const totalLoan=accounts.reduce((s,a)=>s+a.loan_balance,0);
  const unreadCount=(notifs||[]).filter(n=>n.read_status===0).length;

  async function verifyUser(u){
    const patch={kyc_status:u.kyc_status==="verified"?"pending":"verified",profile_complete:u.kyc_status==="verified"?50:100};
    await DS.updateUser(u.id,patch);
    if(patch.kyc_status==="verified")await DS.addNotif(u.id,"Your identity has been verified by Bypay Bank. All features are now unlocked!","success");
    sUsers(prev=>prev.map(x=>x.id===u.id?{...x,...patch}:x));
    t$(`${u.full_name||u.name} ${patch.kyc_status==="verified"?"verified":"unverified"}`);
  }

  async function freezeUser(u){
    const ns=u.status==="frozen"?"active":"frozen";
    await DS.updateUser(u.id,{status:ns});
    const a=accounts.find(a=>a.user_id===u.id);
    if(a)await DS.updateAccount(a.id,{status:ns});
    if(ns==="frozen")await DS.addNotif(u.id,"Your account has been temporarily suspended. Contact us: "+BANK.phone,"alert");
    else await DS.addNotif(u.id,"Your Bypay Bank account has been reactivated. Welcome back!","success");
    sUsers(prev=>prev.map(x=>x.id===u.id?{...x,status:ns}:x));
    sAccounts(prev=>prev.map(x=>x.user_id===u.id?{...x,status:ns}:x));
    t$(`${u.full_name||u.name} ${ns}`);
  }

  const ADMIN_TABS=[
    {id:"dashboard",icon:"📊",label:"Overview"},
    {id:"users",icon:"👥",label:"Clients"},
    {id:"txns",icon:"📋",label:"Transactions"},
    {id:"notifs",icon:"🔔",label:"Alerts",badge:unreadCount},
    {id:"security",icon:"🛡",label:"Security"},
  ];

  if(loading)return(
    <div style={{position:"fixed",inset:0,background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
      <Spin size={36}/><div style={{fontSize:14,color:C.muted}}>Loading admin data…</div>
    </div>
  );

  return(
    <div style={{position:"fixed",inset:0,display:"flex",flexDirection:"column",background:C.bg}}>
      {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>sToast(null)}/>}
      {screen&&React.cloneElement(screen,{onBack:()=>sScreen(null),userMap,acctMap,txns,notifs,sNotifs,loans,users,sUsers,sAccounts,verifyUser,freezeUser,t$})}

      {!screen&&<>
        <div style={{background:C.navy,paddingTop:"env(safe-area-inset-top)",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 18px"}}>
            <div>
              <div style={{fontWeight:800,fontSize:16,color:"#fff",letterSpacing:.5}}>BYPAY BANK</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>Admin Dashboard · {admin.role}</div>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {IS_DEMO&&<div style={{background:"rgba(245,158,11,0.2)",color:"#F59E0B",fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:8}}>DEMO</div>}
              <button onClick={async()=>{await DS.logout();onLogout();}} style={{background:"rgba(255,255,255,0.12)",border:"none",color:"rgba(255,255,255,0.7)",borderRadius:8,padding:"7px 12px",cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}}>Logout</button>
            </div>
          </div>
        </div>

        <div style={{flex:1,overflowY:"auto"}}>
          {/* DASHBOARD */}
          {activeTab==="dashboard"&&(
            <div style={{padding:16}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
                {[[fmtS(totalBal),"Total Deposits",C.blue,"💰"],[fmtS(totalSav),"Total Savings",C.green,"🐖"],[fmtS(totalLoan),"Loan Portfolio",C.orange,"🏛"],[users.length,"Total Clients",C.navy,"👥"],[users.filter(u=>u.kyc_status==="verified").length,"KYC Verified",C.green,"✓"],[users.filter(u=>u.kyc_status!=="verified").length,"Pending KYC",C.red,"⚠"]].map(([v,l,c,i])=>(
                  <Card key={l} style={{padding:14}}>
                    <div style={{width:38,height:38,borderRadius:11,background:c+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,marginBottom:8}}>{i}</div>
                    <div style={{fontFamily:"serif",fontSize:20,fontWeight:700,color:c}}>{v}</div>
                    <div style={{fontSize:11,color:C.muted,marginTop:2}}>{l}</div>
                  </Card>
                ))}
              </div>
              <SH title="Recent Transactions"/>
              <Card>
                {txns.slice(0,8).map(t=>(
                  <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{width:40,height:40,borderRadius:12,background:(CAT[t.category]?.bg||"#F8F9FA"),display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0,fontWeight:700,color:CAT[t.category]?.color||C.muted}}>{CAT[t.category]?.icon||"💳"}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{userMap[t.user_id]?.full_name||t.user_id}</div>
                      <div style={{fontSize:11,color:C.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.description}</div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      <div style={{fontWeight:700,fontSize:13,color:t.type==="credit"?C.green:C.red}}>{t.type==="credit"?"+":"-"}{fmtS(t.amount)}</div>
                      <div style={{fontSize:10,color:C.muted}}>{t.created_at?.slice(0,10)}</div>
                    </div>
                  </div>
                ))}
              </Card>
            </div>
          )}

          {/* CLIENTS */}
          {activeTab==="users"&&(
            <div style={{padding:16}}>
              <div style={{display:"flex",gap:10,marginBottom:14}}>
                {[[users.filter(u=>u.kyc_status==="verified").length,"Verified",C.green],[users.filter(u=>u.kyc_status!=="verified").length,"Pending KYC",C.red],[users.filter(u=>u.status==="frozen").length,"Frozen",C.orange]].map(([v,l,c])=>(
                  <Card key={l} style={{flex:1,textAlign:"center",padding:12}}>
                    <div style={{fontFamily:"serif",fontSize:22,fontWeight:700,color:c}}>{v}</div>
                    <div style={{fontSize:10,color:C.muted,marginTop:2}}>{l}</div>
